name: CTA official FPL feed ingestion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "canonical_candidate/engineering_workbench/scripts/fetch_fpl_official_api.py"
      - "canonical_candidate/engineering_workbench/scripts/build_fpl_lagged_features.py"
      - "canonical_candidate/engineering_workbench/scripts/aggregate_fpl_gameweek_rows.py"
      - "canonical_candidate/engineering_workbench/scripts/build_fpl_baseline_forecast_snapshot.py"
      - "canonical_candidate/engineering_workbench/scripts/general_market_engine.py"
      - "canonical_candidate/engineering_workbench/scripts/run_fpl_general_market_baseline.py"
      - "canonical_candidate/engineering_workbench/scripts/personal_squad_engine.py"
      - "canonical_candidate/engineering_workbench/scripts/train_fpl_exploratory_ridge.py"
      - "canonical_candidate/engineering_workbench/scripts/run_fpl_personal_squad_scale_smoke_test.py"
      - "canonical_candidate/engineering_workbench/scripts/compare_fpl_general_market_outputs.py"
      - "canonical_candidate/engineering_workbench/src/js/general_market_engine.mjs"
      - "canonical_candidate/engineering_workbench/src/js/personal_squad_engine.mjs"
      - "canonical_candidate/engineering_workbench/tests/js/run_fpl_general_market_snapshot.mjs"
      - "canonical_candidate/engineering_workbench/tests/js/run_fpl_personal_squad_snapshot.mjs"
      - "canonical_candidate/engineering_workbench/scripts/compare_fpl_personal_squad_outputs.py"
      - "canonical_candidate/engineering_workbench/scripts/build_opta_lagged_team_features.py"
      - "canonical_candidate/engineering_workbench/scripts/evaluate_opta_team_context.py"
      - "canonical_candidate/engineering_workbench/scripts/train_fpl_nested_tuned_ridge.py"
      - "canonical_candidate/engineering_workbench/scripts/audit_11footy_fpl_identity_candidates.py"
      - "canonical_candidate/engineering_workbench/scripts/verify_11footy_fpl_identity_crosswalk.py"
      - "canonical_candidate/engineering_workbench/scripts/build_11footy_player_match_features.py"
      - "canonical_candidate/engineering_workbench/scripts/build_11footy_lagged_research_features.py"
      - "canonical_candidate/engineering_workbench/scripts/build_11footy_lagged_verified_features.py"
      - "canonical_candidate/engineering_workbench/scripts/validate_provider_identity_crosswalk.py"
      - "canonical_candidate/engineering_workbench/tests/test_11footy_fpl_identity_candidates.py"
      - "canonical_candidate/engineering_workbench/tests/test_11footy_verified_crosswalk.py"
      - "canonical_candidate/engineering_workbench/tests/test_11footy_player_match_features.py"
      - "canonical_candidate/engineering_workbench/tests/test_11footy_lagged_research_features.py"
      - "canonical_candidate/engineering_workbench/tests/test_11footy_lagged_verified_features.py"
      - "canonical_candidate/engineering_workbench/tests/test_provider_identity_crosswalk.py"
      - "canonical_candidate/data/11footy_fpl_identity_crosswalk.csv"
      - "canonical_candidate/engineering_workbench/scripts/audit_onside_against_fpl_actuals.py"
  schedule:
    - cron: "30 5 * * *"
permissions:
  contents: read

concurrency:
  group: cta-fpl-official-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run FPL ingestion tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
        run: |
          python -m pytest -q \
            tests/test_fpl_ingestion.py \
            tests/test_player_identity_crosswalk.py \
            tests/test_fpl_lagged_features.py \
            tests/test_player_feature_enrichment.py \
            tests/test_fpl_gameweek_aggregation.py \
            tests/test_fpl_naive_baselines.py \
            tests/test_fpl_covariance.py \
            tests/test_fpl_effective_ownership.py \
            tests/test_fpl_baseline_forecast_snapshot.py \
            tests/test_fpl_general_market_baseline.py \
            tests/test_fpl_personal_squad_scale_smoke_test.py \
            tests/test_fpl_personal_squad_parity.py \
            tests/test_fpl_exploratory_ridge.py \
            tests/test_opta_lagged_team_features.py \
            tests/test_opta_team_context_evaluation.py \
            tests/test_provider_identity_crosswalk.py \
            tests/test_fpl_nested_tuned_ridge.py \
            tests/test_onside_fpl_actuals_cross_audit.py \
            tests/test_11footy_fpl_identity_candidates.py \
            tests/test_11footy_player_match_features.py \
            tests/test_11footy_lagged_research_features.py \\
            tests/test_11footy_lagged_verified_features.py
      - name: Validate verified player identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_player_identity_crosswalk.py \
            --input ../data/player_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/identity_crosswalk

      - name: Fetch official FPL data
        run: |
          python canonical_candidate/engineering_workbench/scripts/fetch_fpl_official_api.py \
            --out-dir run_artifacts/fpl_official \
            --workers 2 \
            --delay 0.15

      - name: Download pinned 11footy EPL match and player sources
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/11footy_fpl/source run_artifacts/11footy_fpl/output
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            https://github.com/fm-devlab/11footy-dataset/releases/download/11footy-2026-11-10/england.premier-league.db.xz \
            -o run_artifacts/11footy_fpl/source/england.premier-league.db.xz
          echo "a74e735c01a0f6da9b871ade0031573e212ba7f8be0698b29d240921aea0485f  run_artifacts/11footy_fpl/source/england.premier-league.db.xz" | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://github.com/fm-devlab/11footy-dataset/releases/download/11footy-2026-11-10/players.db.xz \
            -o run_artifacts/11footy_fpl/source/players.db.xz
          echo "a0ad11b9f7bb8f845c6f62bc2cacc27639ea7a7f2f9ce861485297bc6db0d0c2  run_artifacts/11footy_fpl/source/players.db.xz" | sha256sum --check

      - name: Generate 11footy identity candidates from the same FPL snapshot
        continue-on-error: true
        run: |
          FPL_SEASON=$(python -c 'import json; print(json.load(open("run_artifacts/fpl_official/ingestion_report.json"))["season"])')
          CROSSWALK_SEASON="${FPL_SEASON/-//}"
          python canonical_candidate/engineering_workbench/scripts/audit_11footy_fpl_identity_candidates.py \
            --players-input run_artifacts/11footy_fpl/source/players.db.xz \
            --fpl-bootstrap run_artifacts/fpl_official/bootstrap-static.json \
            --season "$CROSSWALK_SEASON" \
            --release 11footy-2026-11-10 \
            --out-dir run_artifacts/11footy_fpl

      - name: Build exact one-to-one 11footy to FPL identity crosswalk
        continue-on-error: true
        run: |
          python canonical_candidate/engineering_workbench/scripts/verify_11footy_fpl_identity_crosswalk.py \
            --candidates run_artifacts/11footy_fpl/identity_candidates.csv \
            --out-dir run_artifacts/11footy_fpl/verified_identity

      - name: Validate exact one-to-one 11footy to FPL identity crosswalk
        continue-on-error: true
        run: |
          python canonical_candidate/engineering_workbench/scripts/validate_provider_identity_crosswalk.py \
            --provider 11footy \
            --input run_artifacts/11footy_fpl/verified_identity/verified_11footy_fpl_identity_crosswalk.csv \
            --out-dir run_artifacts/11footy_fpl/verified_identity/validation

      - name: Build 11footy player-match panel and corroborate pending identities
        continue-on-error: true
        run: |
          FPL_SEASON=$(python -c 'import json; print(json.load(open("run_artifacts/fpl_official/ingestion_report.json"))["season"])')
          python canonical_candidate/engineering_workbench/scripts/build_11footy_player_match_features.py \
            --database run_artifacts/11footy_fpl/source/england.premier-league.db.xz \
            --players-database run_artifacts/11footy_fpl/source/players.db.xz \
            --fpl-fixtures run_artifacts/fpl_official/fpl_fixtures.csv \
            --fpl-players run_artifacts/fpl_official/fpl_players.csv \
            --fpl-player-fixture run_artifacts/fpl_official/fpl_player_fixture.csv \
            --candidates run_artifacts/11footy_fpl/identity_candidates.csv \
            --crosswalk run_artifacts/11footy_fpl/verified_identity/validation/verified_provider_fpl_crosswalk.csv \
            --crosswalk-validation run_artifacts/11footy_fpl/verified_identity/validation/crosswalk_validation.json \
            --season "$FPL_SEASON" \
            --release 11footy-2026-11-10 \
            --competition-id 1 \
            --out-dir run_artifacts/11footy_fpl/output

      - name: Publish aggregate-only 11footy/FPL integration status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("run_artifacts/11footy_fpl/output/11footy_fpl_player_match_integration.json")
          target = Path("run_artifacts/fpl_official/11footy_player_match_integration.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          if source.exists():
              report = json.loads(source.read_text())
              safe = {
                  "provider": report["provider"],
                  "source_release": report["source_release"],
                  "season": report["season"],
                  "competition_id": report["competition_id"],
                  "11footy_season_id": report["11footy_season_id"],
                  "source_built_at": report["source_built_at"],
                  "latest_completed_match_kickoff_utc": report["latest_completed_match_kickoff_utc"],
                  "source_match_count": report["source_match_count"],
                  "provider_matches_with_fixture_match": report["provider_matches_with_fixture_match"],
                  "unique_fpl_fixture_ids_matched": report["unique_fpl_fixture_ids_matched"],
                  "fixture_match_status_counts": report["fixture_match_status_counts"],
                  "player_match_rows": report["player_match_rows"],
                  "player_match_rows_with_fpl_fixture": report["player_match_rows_with_fpl_fixture"],
                  "player_match_rows_unmatched_fixture": report["player_match_rows_unmatched_fixture"],
                  "player_match_rows_ambiguous_fixture": report["player_match_rows_ambiguous_fixture"],
                  "player_match_rows_with_candidate_identity": report["player_match_rows_with_candidate_identity"],
                  "candidate_identity_count": report["candidate_identity_count"],
                  "candidate_high_confidence_count": report["candidate_high_confidence_count"],
                  "candidate_rows_with_multi_match_consistency": report["candidate_rows_with_multi_match_consistency"],
                  "candidate_review_priority_counts": report["candidate_review_priority_counts"],
                  "candidate_rows_with_any_match_conflict": report["candidate_rows_with_any_match_conflict"],
                  "verified_crosswalk_rows": report["verified_crosswalk_rows"],
                  "crosswalk_validation_status": report["crosswalk_validation_status"],
                  "player_match_rows_with_verified_identity": report["player_match_rows_with_verified_identity"],
                  "verified_player_match_panel_rows": report["verified_player_match_panel_rows"],
                  "provisional_research_panel_rows": report["provisional_research_panel"]["rows"],
                  "provisional_research_panel_players": report["provisional_research_panel"]["unique_fpl_players"],
                  "provisional_research_panel_fixtures": report["provisional_research_panel"]["unique_fpl_fixtures"],
                  "provisional_research_panel_production_eligible": report["provisional_research_panel"]["production_eligible"],
                  "provisional_research_panel_prediction_training_eligible": report["provisional_research_panel"]["prediction_training_eligible"],
                  "verified_identity_history_missing_rows": report["verified_identity_history_missing_rows"],
                  "verified_team_mismatch_rows": report["verified_team_mismatch_rows"],
                  "verified_fpl_player_missing_rows": report["verified_fpl_player_missing_rows"],
                  "provider_team_ids_not_in_match_teams": report["provider_team_ids_not_in_match_teams"],
                  "duplicate_fpl_player_fixture_keys": report["duplicate_fpl_player_fixture_keys"],
                  "join_ready": report["join_ready"],
                  "status": report["status"],
                  "source_hashes": report["source_hashes"],
                  "attribution": report["attribution"],
                  "identity_policy": report["identity_policy"],
                  "candidate_evidence_policy": report["candidate_evidence_policy"],
                  "prediction_validation": report["prediction_validation"],
                  "publication_policy": "Aggregate-only; candidate evidence rows and player-match feature rows remain inside the workflow runner."
              }
          else:
              safe = {
                  "provider": "11footy",
                  "status": "UNAVAILABLE_OR_INTEGRATION_STEP_FAILED",
                  "join_ready": False,
                  "prediction_validation": "NOT_EVALUATED",
                  "publication_policy": "No provider-level rows are published."
              }
          target.write_text(json.dumps(safe, indent=2))
          print(json.dumps(safe, indent=2))
          PY
      - name: Build leakage-safe lagged FPL dataset
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_fpl_lagged_features.py \
            --players run_artifacts/fpl_official/fpl_players.csv \
            --fixtures run_artifacts/fpl_official/fpl_fixtures.csv \
            --history run_artifacts/fpl_official/fpl_player_fixture.csv \
            --bootstrap run_artifacts/fpl_official/bootstrap-static.json \
            --out-dir run_artifacts/fpl_official

      - name: Build deadline-safe verified 11footy CTA features for the upcoming FPL gameweek
        continue-on-error: true
        run: |
          PANEL="run_artifacts/11footy_fpl/output/verified_player_match_panel.csv"
          SOURCE_REPORT="run_artifacts/11footy_fpl/output/11footy_fpl_player_match_integration.json"
          if [ -f "$PANEL" ] && [ -f "$SOURCE_REPORT" ]; then
            python canonical_candidate/engineering_workbench/scripts/build_11footy_lagged_verified_features.py \
              --cta-panel "$PANEL" \
              --source-report "$SOURCE_REPORT" \
              --fpl-players run_artifacts/fpl_official/fpl_players.csv \
              --fpl-fixtures run_artifacts/fpl_official/fpl_fixtures.csv \
              --bootstrap run_artifacts/fpl_official/bootstrap-static.json \
              --source-metadata run_artifacts/fpl_official/source_metadata.json \
              --out-dir run_artifacts/11footy_fpl/output
          else
            echo "WARNING: verified CTA player-match panel is unavailable"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("run_artifacts/11footy_fpl/output/11footy_lagged_verified_upcoming_report.json")
          target = Path("run_artifacts/fpl_official/11footy_lagged_verified_upcoming_summary.json")
          if source.exists():
              report = json.loads(source.read_text())
              keys = (
                  "status", "rows", "unique_players", "unique_fixtures", "gameweeks",
                  "verified_crosswalk_rows", "verified_player_match_panel_rows",
                  "source_snapshot_as_of", "rows_with_source_snapshot_available_as_of_deadline",
                  "rows_without_source_snapshot_available_as_of_deadline",
                  "rows_with_prior_cta_history", "rows_without_prior_cta_history",
                  "players_with_prior_cta_history", "coverage_by_gameweek",
                  "prior_feature_coverage_rows", "target_gameweeks", "upcoming_target_summary",
                  "temporal_policy", "identity_status", "prediction_training_eligible",
                  "production_eligible", "decision_use_status", "eligibility_reason",
                  "source_hashes", "attribution"
              )
              safe = {key: report.get(key) for key in keys}
          else:
              safe = {
                  "status": "VERIFIED_UPCOMING_CTA_FEATURE_BUILD_UNAVAILABLE",
                  "rows": 0,
                  "prediction_training_eligible": False,
                  "production_eligible": False,
                  "decision_use_status": "RESEARCH_ONLY_NOT_IN_BASELINE"
              }
          safe["publication_policy"] = "Aggregate metrics only; player-level CTA feature rows remain inside the workflow runner."
          target.write_text(json.dumps(safe, indent=2))
          print(json.dumps(safe, indent=2))
          PY

      - name: Build leakage-safe lagged 11footy CTA research features
        continue-on-error: true
        run: |
          PANEL="run_artifacts/11footy_fpl/output/provisional_research_only_player_match_panel.csv"
          if [ -f "$PANEL" ]; then
            python canonical_candidate/engineering_workbench/scripts/build_11footy_lagged_research_features.py \
              --cta-panel "$PANEL" \
              --fpl-training run_artifacts/fpl_official/fpl_lagged_training.csv \
              --fpl-report run_artifacts/fpl_official/fpl_lagged_training_report.json \
              --out-dir run_artifacts/11footy_fpl/output || echo "WARNING: lagged CTA research feature build failed"
          else
            echo "WARNING: provisional CTA research panel is unavailable"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("run_artifacts/11footy_fpl/output/11footy_lagged_research_report.json")
          target = Path("run_artifacts/fpl_official/11footy_lagged_research_summary.json")
          if source.exists():
              report = json.loads(source.read_text())
              safe = {
                  key: report[key] for key in (
                      "status", "rows", "unique_players", "unique_fixtures", "gameweeks",
                      "rows_with_prior_cta_history", "rows_without_prior_cta_history",
                      "players_with_prior_cta_history", "coverage_by_gameweek",
                      "prior_feature_coverage_rows", "source_cta_rows_skipped",
                      "temporal_policy", "rolling_window_unit", "fpl_point_in_time_status",
                      "prediction_training_eligible", "production_eligible", "eligibility_reason"
                  )
              }
          else:
              safe = {
                  "status": "CTA_LAGGED_RESEARCH_FEATURES_UNAVAILABLE",
                  "rows": 0,
                  "prediction_training_eligible": False,
                  "production_eligible": False
              }
          safe["publication_policy"] = "Aggregate metrics only; player-level lagged research rows remain inside the Actions runner."
          target.write_text(json.dumps(safe, indent=2))
          print(json.dumps(safe, indent=2))
          PY

      - name: Fetch pinned Opta/PulseLive team context sources
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/opta_fpl/source run_artifacts/opta_fpl/output
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/imadeddine-belkat/Premier-League-Stats/f0f3d40f803c69bc7fac48d0748b49175e2d08ce/pl_stats/_merged/players/2026-27_players_stats.csv \
            -o run_artifacts/opta_fpl/source/opta_players.csv
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/imadeddine-belkat/Premier-League-Stats/f0f3d40f803c69bc7fac48d0748b49175e2d08ce/pl_stats/_merged/events/2026-27_events_stats.csv \
            -o run_artifacts/opta_fpl/source/opta_team_events.csv
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://onsidearena.com/data/graded-predictions.csv \
            -o run_artifacts/opta_fpl/source/onside_graded_predictions.csv
      - name: Build Opta identity and historical team-context sidecars
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_opta_lagged_team_features.py \
            --bootstrap run_artifacts/fpl_official/bootstrap-static.json \
            --fixtures run_artifacts/fpl_official/fixtures.json \
            --opta-players run_artifacts/opta_fpl/source/opta_players.csv \
            --opta-team-events run_artifacts/opta_fpl/source/opta_team_events.csv \
            --fpl-lagged-training run_artifacts/fpl_official/fpl_lagged_training.csv \
            --out-dir run_artifacts/opta_fpl/output
      - name: Validate Opta/PulseLive to FPL identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider opta_pulselive \
            --input ../../run_artifacts/opta_fpl/output/opta_pulselive_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/opta_fpl/output/crosswalk_validation
      - name: Evaluate lagged Opta team context on a temporal holdout
        run: |
          python canonical_candidate/engineering_workbench/scripts/evaluate_opta_team_context.py \
            --fpl-training run_artifacts/fpl_official/fpl_lagged_training.csv \
            --opta-features run_artifacts/opta_fpl/output/opta_lagged_historical_player_fixture_features.csv \
            --out-dir run_artifacts/opta_fpl/output
      - name: Cross-audit Onside actual points against official FPL history
        run: |
          python canonical_candidate/engineering_workbench/scripts/audit_onside_against_fpl_actuals.py \
            --fpl-training run_artifacts/fpl_official/fpl_lagged_training.csv \
            --onside-csv run_artifacts/opta_fpl/source/onside_graded_predictions.csv \
            --out-dir run_artifacts/opta_fpl/output
      - name: Enforce Opta identity, fixture, and historical join integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("run_artifacts/opta_fpl/output")
          integration = json.loads((root / "opta_fpl_integration_report.json").read_text())
          validation = json.loads((root / "crosswalk_validation/crosswalk_validation.json").read_text())
          evaluation = json.loads((root / "opta_team_context_evaluation.json").read_text())
          onside_audit = json.loads((root / "onside_fpl_actuals_cross_audit.json").read_text())
          identity = integration["identity"]
          features = integration["team_features"]
          historical = features["historical_player_fixture_join"]
          failures = []
          if onside_audit["matched_player_gameweek_rows"] < 1:
              failures.append("Onside actual-points audit has no overlapping FPL player-gameweek rows")
          print("Onside/FPL actual-points cross-audit:", onside_audit["status"],
                "matched:", onside_audit["matched_player_gameweek_rows"],
                "exact:", onside_audit["exact_matches"],
                "mismatches:", onside_audit["mismatches"])
          if identity["status"] != "PASS" or validation["status"] != "PASS" or not validation["join_ready"]:
              failures.append("Opta/FPL numeric identity crosswalk did not pass")
          if features["provider_match_ids_not_in_fpl_fixture_list"] or features["provider_matches_with_team_count_not_equal_to_two"] or features["provider_team_ids_not_in_fpl_bootstrap"]:
              failures.append("Opta/FPL fixture or team reconciliation failed")
          if historical["missing_team_context_rows"] != 0 or historical["historical_player_fixture_rows_with_team_context"] != historical["input_fpl_player_fixture_rows"]:
              failures.append("Historical player-fixture sidecar is incomplete")
          if evaluation["join"]["missing_rows"] != 0 or evaluation["join"]["joined_rows"] != evaluation["join"]["fpl_player_fixture_rows"]:
              failures.append("Temporal evaluation join is incomplete")
          if failures:
              raise SystemExit("\\n".join(failures))
          print("PASS: identity, fixture/team reconciliation, historical sidecar, and temporal evaluation join")
          PY
      - name: Publish aggregate Opta evaluation summary only
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          source = Path("run_artifacts/opta_fpl/source")
          output = Path("run_artifacts/opta_fpl/output")
          integration = json.loads((output / "opta_fpl_integration_report.json").read_text())
          validation = json.loads((output / "crosswalk_validation/crosswalk_validation.json").read_text())

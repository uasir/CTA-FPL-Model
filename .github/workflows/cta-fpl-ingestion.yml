name: CTA official FPL feed ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/cta-fpl-ingestion.yml
      - canonical_candidate/engineering_workbench/scripts/fetch_fpl_official_api.py
      - canonical_candidate/engineering_workbench/tests/test_fpl_ingestion.py
      - canonical_candidate/engineering_workbench/scripts/validate_player_identity_crosswalk.py
      - canonical_candidate/engineering_workbench/tests/test_player_identity_crosswalk.py
      - canonical_candidate/data/player_identity_crosswalk.csv
      - canonical_candidate/engineering_workbench/scripts/build_fpl_lagged_features.py
      - canonical_candidate/engineering_workbench/tests/test_fpl_lagged_features.py tests/test_player_feature_enrichment.py
      - canonical_candidate/engineering_workbench/scripts/enrich_player_features.py
      - canonical_candidate/engineering_workbench/tests/test_player_feature_enrichment.py

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run FPL ingestion tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q tests/test_fpl_ingestion.py tests/test_player_identity_crosswalk.py tests/test_fpl_lagged_features.py
      - name: Validate verified player identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_player_identity_crosswalk.py \
            --input ../data/player_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/identity_crosswalk

      - name: Fetch official FPL data
        run: |
          python canonical_candidate/engineering_workbench/scripts/fetch_fpl_official_api.py \
            --out-dir run_artifacts/fpl_official \
            --workers 2 \
            --delay 0.15
      - name: Build leakage-safe lagged FPL dataset
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_fpl_lagged_features.py \
            --players run_artifacts/fpl_official/fpl_players.csv \
            --fixtures run_artifacts/fpl_official/fpl_fixtures.csv \
            --history run_artifacts/fpl_official/fpl_player_fixture.csv \
            --bootstrap run_artifacts/fpl_official/bootstrap-static.json \
            --out-dir run_artifacts/fpl_official

      - name: Upload official FPL snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-fpl-official-${{ github.run_id }}
          path: |
            run_artifacts/fpl_official/
            run_artifacts/identity_crosswalk/
          if-no-files-found: warn
          retention-days: 30

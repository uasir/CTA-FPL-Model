name: CTA official FPL feed ingestion

on:
  workflow_dispatch:
  push:
    paths:
      - "canonical_candidate/engineering_workbench/scripts/fetch_fpl_official_api.py"
      - "canonical_candidate/engineering_workbench/scripts/build_fpl_lagged_features.py"
      - "canonical_candidate/engineering_workbench/scripts/aggregate_fpl_gameweek_rows.py"
      - "canonical_candidate/engineering_workbench/scripts/build_fpl_baseline_forecast_snapshot.py"
      - "canonical_candidate/engineering_workbench/scripts/general_market_engine.py"
      - "canonical_candidate/engineering_workbench/scripts/run_fpl_general_market_baseline.py"
      - "canonical_candidate/engineering_workbench/scripts/personal_squad_engine.py"
      - "canonical_candidate/engineering_workbench/scripts/train_fpl_exploratory_ridge.py"
      - "canonical_candidate/engineering_workbench/scripts/run_fpl_personal_squad_scale_smoke_test.py"
      - "canonical_candidate/engineering_workbench/scripts/compare_fpl_general_market_outputs.py"
      - "canonical_candidate/engineering_workbench/src/js/general_market_engine.mjs"
      - "canonical_candidate/engineering_workbench/src/js/personal_squad_engine.mjs"
      - "canonical_candidate/engineering_workbench/tests/js/run_fpl_general_market_snapshot.mjs"
      - "canonical_candidate/engineering_workbench/tests/js/run_fpl_personal_squad_snapshot.mjs"
      - "canonical_candidate/engineering_workbench/scripts/compare_fpl_personal_squad_outputs.py"
  schedule:
    - cron: "30 5 * * *"
permissions:
  contents: read

concurrency:
  group: cta-fpl-official-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run FPL ingestion tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
        run: |
          python -m pytest -q \
            tests/test_fpl_ingestion.py \
            tests/test_player_identity_crosswalk.py \
            tests/test_fpl_lagged_features.py \
            tests/test_player_feature_enrichment.py \
            tests/test_fpl_gameweek_aggregation.py \
            tests/test_fpl_naive_baselines.py \
            tests/test_fpl_covariance.py \
            tests/test_fpl_effective_ownership.py \
            tests/test_fpl_baseline_forecast_snapshot.py \
            tests/test_fpl_general_market_baseline.py \
            tests/test_fpl_personal_squad_scale_smoke_test.py \
            tests/test_fpl_personal_squad_parity.py \
            tests/test_fpl_exploratory_ridge.py
      - name: Validate verified player identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_player_identity_crosswalk.py \
            --input ../data/player_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/identity_crosswalk

      - name: Fetch official FPL data
        run: |
          python canonical_candidate/engineering_workbench/scripts/fetch_fpl_official_api.py \
            --out-dir run_artifacts/fpl_official \
            --workers 2 \
            --delay 0.15
      - name: Build leakage-safe lagged FPL dataset
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_fpl_lagged_features.py \
            --players run_artifacts/fpl_official/fpl_players.csv \
            --fixtures run_artifacts/fpl_official/fpl_fixtures.csv \
            --history run_artifacts/fpl_official/fpl_player_fixture.csv \
            --bootstrap run_artifacts/fpl_official/bootstrap-static.json \
            --out-dir run_artifacts/fpl_official

      - name: Aggregate FPL player-gameweek targets
        run: |
          python canonical_candidate/engineering_workbench/scripts/aggregate_fpl_gameweek_rows.py \
            --input run_artifacts/fpl_official/fpl_lagged_training.csv \
            --out-dir run_artifacts/fpl_official

      - name: Build official FPL one-gameweek baseline forecast snapshot
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_fpl_baseline_forecast_snapshot.py \
            --players run_artifacts/fpl_official/fpl_players.csv \
            --gameweek-rows run_artifacts/fpl_official/fpl_lagged_gameweek.csv \
            --fixtures run_artifacts/fpl_official/fpl_fixtures.csv \
            --source-metadata run_artifacts/fpl_official/source_metadata.json \
            --out-dir run_artifacts/fpl_official

      - name: Run general-market engine on official FPL baseline
        run: |
          python canonical_candidate/engineering_workbench/scripts/run_fpl_general_market_baseline.py \
            --snapshot run_artifacts/fpl_official/fpl_baseline_forecast_snapshot.json \
            --out-dir run_artifacts/fpl_official

      - name: Run JavaScript general-market engine on official FPL snapshot
        run: |
          node canonical_candidate/engineering_workbench/tests/js/run_fpl_general_market_snapshot.mjs \
            run_artifacts/fpl_official/fpl_baseline_forecast_snapshot.json \
            run_artifacts/fpl_official/fpl_general_market_baseline_js.json
      - name: Compare live Python and JavaScript market outputs
        run: |
          python canonical_candidate/engineering_workbench/scripts/compare_fpl_general_market_outputs.py \
            --python run_artifacts/fpl_official/fpl_general_market_baseline.json \
            --javascript run_artifacts/fpl_official/fpl_general_market_baseline_js.json \
            --out-dir run_artifacts/fpl_official

      - name: Run personal-squad engine scale smoke test on official FPL pool
        run: |
          python canonical_candidate/engineering_workbench/scripts/run_fpl_personal_squad_scale_smoke_test.py \
            --snapshot run_artifacts/fpl_official/fpl_baseline_forecast_snapshot.json \
            --out-dir run_artifacts/fpl_official
      - name: Run JavaScript personal-squad engine on the same synthetic roster and live forecast pool
        run: |
          node canonical_candidate/engineering_workbench/tests/js/run_fpl_personal_squad_snapshot.mjs \
            run_artifacts/fpl_official/fpl_personal_squad_request.json \
            run_artifacts/fpl_official/fpl_personal_squad_scale_smoke_test_js.json
      - name: Compare live-pool Python and JavaScript personal-squad outputs
        run: |
          python canonical_candidate/engineering_workbench/scripts/compare_fpl_personal_squad_outputs.py \
            --python run_artifacts/fpl_official/fpl_personal_squad_scale_smoke_test.json \
            --javascript run_artifacts/fpl_official/fpl_personal_squad_scale_smoke_test_js.json \
            --out-dir run_artifacts/fpl_official

      - name: Evaluate exploratory FPL rolling-history baselines
        run: |
          python canonical_candidate/engineering_workbench/scripts/evaluate_fpl_naive_baselines.py \
            --input run_artifacts/fpl_official/fpl_lagged_gameweek.csv \
            --out-dir run_artifacts/fpl_official

      - name: Train and time-holdout exploratory FPL ridge baseline
        run: |
          python canonical_candidate/engineering_workbench/scripts/train_fpl_exploratory_ridge.py \
            --input run_artifacts/fpl_official/fpl_lagged_training.csv \
            --out-dir run_artifacts/fpl_official

      - name: Build exploratory FPL CoVar matrix
        run: |
          python canonical_candidate/engineering_workbench/scripts/estimate_fpl_covariance.py \
            --input run_artifacts/fpl_official/fpl_lagged_gameweek.csv \
            --players run_artifacts/fpl_official/fpl_players.csv \
            --out-dir run_artifacts/fpl_official \
            --shrinkage 0.5 \
            --window-size 10

      - name: Upload official FPL snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-fpl-official-${{ github.run_id }}
          path: |
            run_artifacts/fpl_official/
            run_artifacts/identity_crosswalk/
          if-no-files-found: warn
          retention-days: 90

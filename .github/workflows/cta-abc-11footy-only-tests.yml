name: ABC 11footy-only adapter tests

on:
  workflow_dispatch:
  push:
    branches: ["feat/abc-11footy-only-adapter"]
    paths:
      - .github/workflows/cta-abc-11footy-only-tests.yml
      - canonical_candidate/engineering_workbench/scripts/build_cta_abc_11footy_only_panel.py
      - canonical_candidate/engineering_workbench/tests/test_cta_abc_11footy_only_panel.py
      - canonical_candidate/engineering_workbench/scripts/cta_four_layer_pipeline.py

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Run 11footy-only adapter and contract tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts:src
        run: |
          python -m pytest -q \
            tests/test_cta_abc_11footy_only_panel.py \
            tests/test_cta_abc_player_fixture_panel.py \
            tests/test_decision_quality_and_layers.py

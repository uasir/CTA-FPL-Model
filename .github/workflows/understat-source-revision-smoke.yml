name: Understat pinned-source revision audit

on:
  push:
    branches:
      - feat/2pm-defensive-2025-26-train-2026-27-oot
    paths:
      - canonical_candidate/engineering_workbench/scripts/audit_2pm_understat_git_history.py
      - canonical_candidate/engineering_workbench/tests/test_audit_2pm_understat_git_history.py
      - canonical_candidate/engineering_workbench/scripts/audit_2pm_understat_deadline_visibility.py
      - canonical_candidate/engineering_workbench/tests/test_audit_2pm_understat_deadline_visibility.py
      - .github/workflows/understat-source-revision-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: understat-source-revision-smoke-v2
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: python -m pip install pandas requests

      - name: Restore resumable pinned-source revision cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/understat-revision-cache
          key: understat-revision-v2-8c97b2adb123863c3dd581e730f1360e89815ac2-${{ hashFiles('canonical_candidate/engineering_workbench/scripts/audit_2pm_understat_git_history.py') }}-${{ github.run_id }}
          restore-keys: |
            understat-revision-v2-8c97b2adb123863c3dd581e730f1360e89815ac2-

      - name: Create eight-player and complete 100-team inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          from pathlib import Path
          import requests

          repository = "vaastav/Fantasy-Premier-League"
          commit = "8c97b2adb123863c3dd581e730f1360e89815ac2"
          seasons = ["2020-21", "2021-22", "2022-23", "2023-24", "2024-25"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}"}
          tree_response = requests.get(
              f"https://api.github.com/repos/{repository}/git/trees/{commit}?recursive=1",
              headers=headers, timeout=90,
          )
          tree_response.raise_for_status()
          tree = tree_response.json()
          assert not tree.get("truncated"), "Pinned Vaastav tree is truncated"
          paths = {item["path"] for item in tree["tree"] if item.get("type") == "blob"}
          fpl_to_understat = {
              "Man City": "Manchester City",
              "Man Utd": "Manchester United",
              "Newcastle": "Newcastle United",
              "Nott'm Forest": "Nottingham Forest",
              "Sheffield Utd": "Sheffield United",
              "Spurs": "Tottenham",
              "West Brom": "West Bromwich Albion",
              "Wolves": "Wolverhampton Wanderers",
          }
          players = [
              {"source_kind":"pinned_player_csv","understat_id":647,"selected_pinned_tree_path":"data/2023-24/understat/Harry_Kane_647.csv"},
              {"source_kind":"pinned_player_csv","understat_id":453,"selected_pinned_tree_path":"data/2024-25/understat/Son_Heung-Min_453.csv"},
              {"source_kind":"pinned_player_csv","understat_id":447,"selected_pinned_tree_path":"data/2024-25/understat/Kevin_De_Bruyne_447.csv"},
              {"source_kind":"pinned_player_csv","understat_id":489,"selected_pinned_tree_path":"data/2024-25/understat/James_Milner_489.csv"},
              {"source_kind":"pinned_player_csv","understat_id":1665,"selected_pinned_tree_path":"data/2024-25/understat/James_Tarkowski_1665.csv"},
              {"source_kind":"pinned_player_csv","understat_id":745,"selected_pinned_tree_path":"data/2021-22/understat/Kasper_Schmeichel_745.csv"},
              {"source_kind":"pinned_player_csv","understat_id":1250,"selected_pinned_tree_path":"data/2024-25/understat/Mohamed_Salah_1250.csv"},
              {"source_kind":"pinned_player_csv","understat_id":6048,"selected_pinned_tree_path":"data/2024-25/understat/Lewis_Dunk_6048.csv"},
          ]
          teams = []
          missing = []
          session = requests.Session()
          for season in seasons:
              url = f"https://raw.githubusercontent.com/{repository}/{commit}/data/{season}/teams.csv"
              response = session.get(url, headers={"Accept": "text/csv"}, timeout=60)
              response.raise_for_status()
              for team in csv.DictReader(io.StringIO(response.text)):
                  understat_name = fpl_to_understat.get(team["name"], team["name"])
                  source_path = f"data/{season}/understat/understat_{understat_name.replace(' ', '_')}.csv"
                  if source_path not in paths:
                      missing.append(source_path)
                      continue
                  teams.append({"source_kind":"pinned_team_csv","source_path":source_path})
          assert not missing, {"missing_team_sources": missing}
          assert len(players) == 8 and len(teams) == 100, (len(players), len(teams))
          inventory = {"players": players, "teams": teams}
          target = Path(os.environ["RUNNER_TEMP"]) / "understat-smoke-inventory.json"
          target.write_text(json.dumps(inventory, indent=2), encoding="utf-8")
          print(f"Created inventory: {len(players)} player paths, {len(teams)} team-season paths.")
          PY

      - name: Trace eight player histories and all 100 pinned team-season files
        working-directory: canonical_candidate/engineering_workbench
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_2pm_understat_git_history.py --inventory "$RUNNER_TEMP/understat-smoke-inventory.json" --pinned-commit "8c97b2adb123863c3dd581e730f1360e89815ac2" --cache-dir "$RUNNER_TEMP/understat-revision-cache" --max-commits-per-file 100 --limit-player-files 8 --limit-team-files 0 --output "$RUNNER_TEMP/understat-revision-history.json"

      - name: Validate multi-player and multi-club source histories
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "understat-revision-history.json"
          report = json.loads(path.read_text())
          assert report["files_requested"] == 108, report
          assert report["files_audited"] == 108, report
          assert report["admission_decision"] == "NO_FEATURES_ADMITTED", report
          assert sum(result["source_kind"] == "pinned_player_csv" for result in report["results"]) == 8, report
          assert sum(result["source_kind"] == "pinned_team_csv" for result in report["results"]) == 100, report
          empty_revision_seen = False
          for result in report["results"]:
              assert not result.get("error"), result
              assert result.get("errors") == [], result
              assert result["commit_count_returned"] >= 1, result
              assert result["history_truncated"] is False, result
              assert len(result["commit_rows"]) == result["commit_count_returned"], result
              assert result["row_history"], result
              if result["source_kind"] == "pinned_player_csv":
                  match = re.search(r"_(\d+)\.csv$", result["source_path"])
                  assert match, result
                  expected = match.group(1) + "|"
                  assert all(key.startswith(expected) for key in result["row_history"]), result
              else:
                  season, filename = result["source_path"].split("/")[1], result["source_path"].split("/")[-1]
                  club = filename.removeprefix("understat_").removesuffix(".csv").replace("_", " ")
                  expected = f"{season}|{club}|"
                  assert all(key.startswith(expected) for key in result["row_history"]), result
                  if season == "2022-23" and club == "Arsenal":
                      empty_revision_seen = any(row.get("revision_status") == "empty_file" and row.get("rows") == 0 for row in result["commit_rows"])
          assert empty_revision_seen, "Arsenal 2022/23 empty-revision regression was not observed"
          print("PASS: 8 player histories and all 100 pinned team-season histories complete; empty-revision behavior preserved; no feature admission.")
          PY

      - name: Reconcile source rows to FPL fixtures and historical deadlines
        working-directory: canonical_candidate/engineering_workbench
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_2pm_understat_deadline_visibility.py --history-report "$RUNNER_TEMP/understat-revision-history.json" --seasons "2020-21,2021-22,2022-23,2023-24,2024-25" --vaastav-commit "8c97b2adb123863c3dd581e730f1360e89815ac2" --fplcache-commit "6c364bfbd9914649dc5dec016e544be3ae4fe767" --fixture-cache-root "$RUNNER_TEMP/understat-revision-cache/vaastav-fixtures-8c97b2adb123863c3dd581e730f1360e89815ac2" --fplcache-root "$RUNNER_TEMP/understat-revision-cache/fplcache-6c364bfbd9914649dc5dec016e544be3ae4fe767" --output "$RUNNER_TEMP/understat-deadline-visibility-audit.json" --detail-output "$RUNNER_TEMP/understat-deadline-visibility-audit.csv"

      - name: Validate Arsenal fixture date correction at GW26 deadline
        run: |
          python - <<'PY'
          import json
          import os
          import pandas as pd
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "understat-deadline-visibility-audit.json").read_text())
          assert report["admission_decision"] == "NO_FEATURES_ADMITTED", report
          candidates = [
              row for row in report["date_correction_reconciliations"]
              if row["source_path"] == "data/2022-23/understat/understat_Arsenal.csv"
              and row["old_date"] == "2023-03-02 20:00:00"
              and row["new_date"] == "2023-03-01 20:00:00"
          ]
          assert len(candidates) == 1, candidates
          correction = candidates[0]
          assert correction["fixture_mapping_status"] == "same_canonical_fixture", correction
          assert correction["fixture_id"] == 61 and correction["fixture_event"] == 25, correction
          assert correction["fixture_kickoff_time"].startswith("2023-03-01T19:45:00"), correction
          detail = pd.read_csv(root / "understat-deadline-visibility-audit.csv")
          gw26 = detail.loc[
              detail["source_path"].eq("data/2022-23/understat/understat_Arsenal.csv")
              & detail["fixture_id"].eq(61)
              & detail["gameweek"].eq(26)
          ]
          assert len(gw26) == 1, gw26.to_dict("records")
          row = gw26.iloc[0]
          assert bool(row["deadline_verified"]), row.to_dict()
          assert row["visibility_status"] == "repository_proven_prior_row", row.to_dict()
          assert bool(row["value_matches_final"]), row.to_dict()

          # 2020/21's early FPL-cache deadline snapshots are absent. Keep these
          # rows explicitly unverified, but expose provisional final-calendar
          # timing to identify a source-value revision window without admitting it.
          liverpool = detail.loc[
              detail["source_path"].eq("data/2020-21/understat/understat_Liverpool.csv")
              & detail["fixture_id"].eq(11)
          ]
          early = liverpool.loc[liverpool["gameweek"].between(3, 8)]
          assert len(early) == 6, early.to_dict("records")
          assert early["deadline_status"].eq("no_pre_deadline_snapshot").all(), early.to_dict("records")
          assert early["visibility_status"].eq("deadline_unverified").all(), early.to_dict("records")
          assert early["provisional_visibility_status"].eq("repository_proven_prior_row").all(), early.to_dict("records")
          assert (~early["provisional_value_matches_final"].astype(bool)).all(), early.to_dict("records")
          gw9 = liverpool.loc[liverpool["gameweek"].eq(9)]
          assert len(gw9) == 1, gw9.to_dict("records")
          assert gw9.iloc[0]["visibility_status"] == "deadline_unverified", gw9.to_dict("records")
          assert bool(gw9.iloc[0]["provisional_value_matches_final"]), gw9.to_dict("records")
          print("PASS: Arsenal date correction is fixture-confirmed and value-safe by GW26; Liverpool's early 2020/21 value-revision window is surfaced as PROVISIONAL ONLY because those deadlines lack archived snapshots; no feature admission.")
          PY

      - name: Upload bounded source-history and deadline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: understat-source-history-and-deadline-smoke
          path: |
            ${{ runner.temp }}/understat-revision-history.json
            ${{ runner.temp }}/understat-deadline-visibility-audit.json
            ${{ runner.temp }}/understat-deadline-visibility-audit.csv
          if-no-files-found: error
          retention-days: 14

      - name: Save resumable pinned-source revision cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/understat-revision-cache
          key: understat-revision-v2-8c97b2adb123863c3dd581e730f1360e89815ac2-${{ hashFiles('canonical_candidate/engineering_workbench/scripts/audit_2pm_understat_git_history.py') }}-${{ github.run_id }}

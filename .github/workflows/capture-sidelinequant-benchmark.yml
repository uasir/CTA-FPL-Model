name: Capture Sideline Quant raw benchmark snapshot

on:
  push:
    paths:
      - ".github/workflows/trigger-sidelinequant-gw12.txt"
  workflow_dispatch:
    inputs:
      season:
        description: FPL season label
        required: true
        default: "2026-27"
      gameweek:
        description: Target Gameweek
        required: true

permissions:
  contents: read

concurrency:
  group: sidelinequant-benchmark-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture immutable raw Sideline Quant feed
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/capture_sideline_quant_raw.py \
            --season "${{ inputs.season || '2026-27' }}" \
            --gameweek "${{ inputs.gameweek || '12' }}" \
            --output "artifacts/sidelinequant/sidelinequant-${{ inputs.season || '2026-27' }}-gw${{ inputs.gameweek || '12' }}-raw.json"
      - name: Normalize fixture-grain snapshot and explicit Gameweek xP sum
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/parse_sideline_quant_snapshot.py \
            --input "artifacts/sidelinequant/sidelinequant-${{ inputs.season || '2026-27' }}-gw${{ inputs.gameweek || '12' }}-raw.json" \
            --output "artifacts/sidelinequant/sidelinequant-${{ inputs.season || '2026-27' }}-gw${{ inputs.gameweek || '12' }}-normalized.json"
      - name: Create metadata-only public summary
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/summarize_provider_capture.py \
            --provider "Sideline Quant" \
            --input "artifacts/sidelinequant/sidelinequant-${{ inputs.season || '2026-27' }}-gw${{ inputs.gameweek || '12' }}-raw.json" \
            --normalized "artifacts/sidelinequant/sidelinequant-${{ inputs.season || '2026-27' }}-gw${{ inputs.gameweek || '12' }}-normalized.json" \
            --output "artifacts/provider-summary/sidelinequant.json"
      - name: Upload metadata-only capture summary
        uses: actions/upload-artifact@v4
        with:
          name: sidelinequant-summary-${{ inputs.season || '2026-27' }}-gw${{ inputs.gameweek || '12' }}-${{ github.run_id }}
          path: canonical_candidate/engineering_workbench/artifacts/provider-summary/sidelinequant.json
          if-no-files-found: error
          retention-days: 90

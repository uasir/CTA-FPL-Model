name: CTA pre-deadline FPL effective ownership capture

on:
  workflow_dispatch:
  schedule:
    # Poll every five minutes so a pre-deadline rank cohort can be captured
    # shortly before lock; the job then waits and fetches picks after lock.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: cta-fpl-eo-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture pre-deadline rank cohort and post-lock manager picks
        run: |
          python canonical_candidate/engineering_workbench/scripts/capture_fpl_ranked_manager_picks.py \
            --out-dir run_artifacts/fpl_eo \
            --rank-limit 10000 \
            --sample-size 100 \
            --workers 2 \
            --delay 0.15 \
            --deadline-window-minutes 7 \
            --lock-grace-seconds 60
      - name: Upload verified post-lock EO snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-fpl-eo-${{ github.run_id }}
          path: run_artifacts/fpl_eo/
          if-no-files-found: ignore
          retention-days: 90

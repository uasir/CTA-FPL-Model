name: CTA pre-deadline FPL effective ownership capture

on:
  workflow_dispatch:
  schedule:
    # Start about 20 minutes before the observed :00/:30 deadline cadence.
    # The 25-minute window absorbs best-effort scheduler delay while still freezing
    # the rank cohort before lock; picks are fetched only after the 60-second grace.
    - cron: "10,40 * * * *"

permissions:
  contents: read

concurrency:
  group: cta-fpl-eo-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture pre-deadline rank cohort and post-lock manager picks
        run: |
          python canonical_candidate/engineering_workbench/scripts/capture_fpl_ranked_manager_picks.py \
            --out-dir run_artifacts/fpl_eo \
            --rank-limit 10000 \
            --sample-size 100 \
            --workers 2 \
            --delay 0.15 \
            --deadline-window-minutes 25 \
            --lock-grace-seconds 60
      - name: Upload verified post-lock EO snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-fpl-eo-${{ github.run_id }}
          path: run_artifacts/fpl_eo/
          if-no-files-found: ignore
          retention-days: 90

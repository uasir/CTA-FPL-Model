name: CTA independent 34-match run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cta-independent-multimatch.yml
      - canonical_candidate/engineering_workbench/scripts/audit_multimatch_parity.py
      - canonical_candidate/engineering_workbench/scripts/audit_multimatch_data_quality.py
      - canonical_candidate/engineering_workbench/src/cta_audit/audit.py
      - canonical_candidate/engineering_workbench/tests/test_audit.py
      - canonical_candidate/src/cta_engine.py
      - canonical_candidate/engineering_workbench/src/js/cta_core.mjs
      - canonical_candidate/engineering_workbench/src/js/run_pilot_parity.mjs
      - canonical_candidate/engineering_workbench/config/cta_core_parity_contract.json
      - canonical_candidate/tests/test_engine.py
      - canonical_candidate/engineering_workbench/tests/js/cta_core.test.mjs
      - canonical_candidate/engineering_workbench/scripts/diagnose_360_uuid_ownership.py
      - canonical_candidate/engineering_workbench/tests/test_360_uuid_ownership.py

permissions:
  contents: read

jobs:
  multi-match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Python tests
        working-directory: canonical_candidate
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests
      - name: Run workbench tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests
      - name: Fetch pinned StatsBomb sample
        shell: bash
        run: |
          set -euo pipefail
          commit="4b73468fc5b0f1950f9f66fada70ad3a4f9327cb"
          mkdir -p /tmp/cta-input/events /tmp/cta-input/three-sixty /tmp/cta-input/js-empty-frames
          events=(3920384 3920397 3920410 3922239 3923881 3895052 3895113 3895167 3895232 3895286 3895320 3857286 3857272 3857261 3857293 3869685 3773593 3773656 3773552 3773415 3773497 3773457 3837650 3837706 3837785 3837885 3837947 3838017 3754078 3754335 3754162 3754348 3754075 3754159)
          frames=(3895052 3895113 3895167 3895232 3895286 3895320 3857286 3857272 3857261 3857293 3869685 3773593 3773656 3773552 3773415 3773497 3773457 3837650 3837706 3837785 3837885 3837947 3838017)
          for id in "${events[@]}"; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/hudl/open-data/$commit/data/events/$id.json" -o "/tmp/cta-input/events/$id.json"
          done
          for id in "${frames[@]}"; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/hudl/open-data/$commit/data/three-sixty/$id.json" -o "/tmp/cta-input/three-sixty/$id.json"
          done
          printf '[]\n' > /tmp/cta-input/js-empty-frames/no_360.json
      - name: Prepare clean output directory
        run: |
          rm -rf run_artifacts
          mkdir -p run_artifacts
      - name: Preserve source inputs for the 360 join anomaly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/diagnostics/3837706
          cp /tmp/cta-input/events/3837706.json run_artifacts/diagnostics/3837706/events.json
          cp /tmp/cta-input/three-sixty/3837706.json run_artifacts/diagnostics/3837706/three_sixty.json
      - name: Diagnose 360 UUID ownership across sampled event files
        run: |
          python canonical_candidate/engineering_workbench/scripts/diagnose_360_uuid_ownership.py \
            --events-dir /tmp/cta-input/events \
            --frame-file /tmp/cta-input/three-sixty/3837706.json \
            --target-match-id 3837706 \
            --out run_artifacts/diagnostics/3837706/360_uuid_ownership.json
      - name: Execute Python and JavaScript cores for all matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/python run_artifacts/javascript
          for event_file in /tmp/cta-input/events/*.json; do
            id="$(basename "$event_file" .json)"
            event_dir="/tmp/cta-input/single-event/$id"
            frame_dir="/tmp/cta-input/single-three-sixty/$id"
            mkdir -p "$event_dir" "$frame_dir"
            cp "$event_file" "$event_dir/$id.json"
            frame_file="/tmp/cta-input/three-sixty/$id.json"
            if [[ -f "$frame_file" ]]; then
              cp "$frame_file" "$frame_dir/$id.json"
            else
              frame_file="/tmp/cta-input/js-empty-frames/no_360.json"
            fi
            python canonical_candidate/src/cta_engine.py \
              --events-dir "$event_dir" \
              --three-sixty-dir "$frame_dir" \
              --output-dir "run_artifacts/python/$id"
            node canonical_candidate/engineering_workbench/src/js/run_pilot_parity.mjs \
              --events "$event_file" \
              --three-sixty "$frame_file" \
              --out "run_artifacts/javascript/$id"
          done
      - name: Audit Python–JavaScript parity for all matches
        shell: bash
        run: |
          set -euo pipefail
          python canonical_candidate/engineering_workbench/scripts/audit_multimatch_parity.py \
            --python-root run_artifacts/python \
            --javascript-root run_artifacts/javascript \
            --out run_artifacts/parity \
            --expected-matches 34
      - name: Audit multi-match data quality and FPL readiness
        shell: bash
        run: |
          set -euo pipefail
          python canonical_candidate/engineering_workbench/scripts/audit_multimatch_data_quality.py \
            --python-root run_artifacts/python \
            --javascript-root run_artifacts/javascript \
            --parity-report run_artifacts/parity/multimatch_parity_report.json \
            --out run_artifacts/data_quality \
            --expected-matches 34
      - name: Record run metadata
        if: always()
        run: |
          mkdir -p run_artifacts
          {
            echo "CTA independent sample run"
            echo "StatsBomb source commit: 4b73468fc5b0f1950f9f66fada70ad3a4f9327cb"
            echo "Selected matches: 34"
            echo "Matches with 360 source: 23"
            echo "Matches without 360 source: 11"
            echo "Python receives only the current match's 360 file in an isolated directory."
            echo "Feature parity and 360 linkage audits run after both cores complete."
          } > run_artifacts/RUN_SCOPE.txt
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-independent-multimatch-${{ github.run_id }}
          path: run_artifacts/
          if-no-files-found: warn

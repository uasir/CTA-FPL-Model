name: CTA independent 34-match run

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cta-independent-multimatch.yml
      - canonical_candidate/**
      - engineering_state/**
  push:
    branches: [main]
    paths:
      - .github/workflows/cta-independent-multimatch.yml
      - canonical_candidate/**
      - engineering_state/**

permissions:
  contents: read

jobs:
  multi-match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Python core tests
        working-directory: canonical_candidate
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests
      - name: Run workbench Python tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests
      - name: Run JavaScript core tests
        working-directory: canonical_candidate/engineering_workbench
        run: node --test tests/js/cta_core.test.mjs
      - name: Fetch and verify SHA-pinned StatsBomb sample
        shell: bash
        run: |
          set -euo pipefail
          python canonical_candidate/engineering_workbench/tools/fetch_statsbomb_sample.py \
            --manifest canonical_candidate/engineering_workbench/data/manifests/MULTI_MATCH_SAMPLE_MANIFEST_2026-11-17.json \
            --output-dir /tmp/cta-input
          mkdir -p /tmp/cta-input/js-empty-frames
          printf '[]\n' > /tmp/cta-input/js-empty-frames/no_360.json
      - name: Execute Python and JavaScript cores for all matches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run_artifacts
          mkdir -p run_artifacts/python run_artifacts/javascript
          cp /tmp/cta-input/download_report.json run_artifacts/download_report.json
          cp canonical_candidate/engineering_workbench/data/manifests/MULTI_MATCH_SAMPLE_MANIFEST_2026-11-17.json run_artifacts/sample_manifest.json
          for event_file in /tmp/cta-input/events/*.json; do
            id="$(basename "$event_file" .json)"
            event_dir="/tmp/cta-input/single-event/$id"
            frame_dir="/tmp/cta-input/single-three-sixty/$id"
            mkdir -p "$event_dir" "$frame_dir"
            cp "$event_file" "$event_dir/$id.json"
            frame_file="/tmp/cta-input/three-sixty/$id.json"
            if [[ ! -f "$frame_file" ]]; then
              frame_file="/tmp/cta-input/js-empty-frames/no_360.json"
            else
              cp "/tmp/cta-input/three-sixty/$id.json" "$frame_dir/$id.json"
            fi
            python canonical_candidate/src/cta_engine.py \
              --events-dir "$event_dir" \
              --three-sixty-dir "$frame_dir" \
              --output-dir "run_artifacts/python/$id"
            node canonical_candidate/engineering_workbench/src/js/run_pilot_parity.mjs \
              --events "$event_file" \
              --three-sixty "$frame_file" \
              --out "run_artifacts/javascript/$id"
          done
      - name: Audit Python-JavaScript parity for all matches
        shell: bash
        run: |
          set -euo pipefail
          python canonical_candidate/engineering_workbench/scripts/audit_multimatch_parity.py \
            --python-root run_artifacts/python \
            --javascript-root run_artifacts/javascript \
            --out run_artifacts/parity \
            --expected-matches 34
      - name: Audit source and 360 data quality
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python canonical_candidate/engineering_workbench/scripts/audit_multimatch_data_quality.py \
            --manifest canonical_candidate/engineering_workbench/data/manifests/MULTI_MATCH_SAMPLE_MANIFEST_2026-11-17.json \
            --python-root run_artifacts/python \
            --out run_artifacts/data_quality
      - name: Record run metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_artifacts
          if [[ -f /tmp/cta-input/download_report.json ]]; then
            cp /tmp/cta-input/download_report.json run_artifacts/download_report.json
          fi
          {
            echo "CTA independent sample run"
            echo "StatsBomb source commit: 4b73468fc5b0f1950f9f66fada70ad3a4f9327cb"
            echo "Selected event matches: 34"
            echo "Usable 360 sources: 22"
            echo "Present but invalid 360 sources explicitly excluded: 1 (3837706)"
            echo "Matches without 360 source: 11"
            echo "Input event and usable 360 files are checked against Git blob SHA-1 and byte size before processing."
            echo "Python-JavaScript parity and 360 source/linkage quality are separate validation gates."
          } > run_artifacts/RUN_SCOPE.txt
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-independent-multimatch-${{ github.run_id }}
          path: run_artifacts/
          if-no-files-found: warn

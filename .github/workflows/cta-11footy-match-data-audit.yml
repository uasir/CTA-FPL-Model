name: CTA 11footy Premier League match-data audit

on:
  pull_request:
    paths:
      - .github/workflows/cta-11footy-match-data-audit.yml
      - canonical_candidate/engineering_workbench/scripts/audit_11footy_premier_league_data.py
      - canonical_candidate/engineering_workbench/tests/test_11footy_premier_league_data_audit.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cta-11footy-match-data-audit.yml
      - canonical_candidate/engineering_workbench/scripts/audit_11footy_premier_league_data.py
      - canonical_candidate/engineering_workbench/tests/test_11footy_premier_league_data_audit.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cta-11footy-pl-data-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out CTA-FPL-Model
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the pinned 11footy Premier League release
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/11footy/source run_artifacts/11footy/output
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 300 \
            https://github.com/fm-devlab/11footy-dataset/releases/download/11footy-2026-11-10/england.premier-league.db.xz \
            -o run_artifacts/11footy/source/england.premier-league.db.xz
          echo "a74e735c01a0f6da9b871ade0031573e212ba7f8be0698b29d240921aea0485f  run_artifacts/11footy/source/england.premier-league.db.xz" \
            | sha256sum --check

      - name: Audit season, match, event, shot and player-match coverage
        run: |
          python canonical_candidate/engineering_workbench/scripts/audit_11footy_premier_league_data.py \
            --input run_artifacts/11footy/source/england.premier-league.db.xz \
            --release 11footy-2026-11-10 \
            --expected-sha256 a74e735c01a0f6da9b871ade0031573e212ba7f8be0698b29d240921aea0485f \
            --out-dir run_artifacts/11footy/output

      - name: Upload aggregate-only data audit
        uses: actions/upload-artifact@v4
        with:
          name: cta-11footy-premier-league-audit-${{ github.run_id }}
          path: run_artifacts/11footy/output/11footy_premier_league_data_audit.json
          if-no-files-found: error
          retention-days: 90

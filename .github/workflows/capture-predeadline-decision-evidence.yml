name: Capture pre-deadline FPL decision evidence

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: Upcoming target Gameweek
        required: true
        type: string
      manager_team_id:
        description: FPL manager team ID (public workflow input)
        required: true
        default: "421025"
        type: string
      season:
        description: FPL season identifier used by the provider snapshot
        required: true
        default: "2026-27"
        type: string
      manager_state_json:
        description: Confirmed manager state JSON (squad, bank, transfers, XI, bench, captaincy and chip state)
        required: true
        type: string
      field_eo_capture_run_id:
        description: Optional successful provisional pre-deadline field EO capture run ID for this Gameweek
        required: false
        default: ""
        type: string
      covar_capture_run_id:
        description: Optional completed exploratory Onside actual-points CoVar workflow run ID
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M3 implementation
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: feat/m3-external-benchmark-decision-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run capture and admission contract tests
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python -m pip install pytest
          PYTHONPATH=scripts python -m pytest -q \
            tests/test_capture_predeadline_decision_bundle.py \
            tests/test_classify_historical_fpl_evidence.py \
            tests/test_audit_official_fpl_manager_batch.py \
            tests/test_run_predeadline_m3_decision.py \
            tests/test_replay_frozen_m3_decision.py
      - name: Capture and seal pre-deadline decision evidence
        working-directory: canonical_candidate/engineering_workbench
        env:
          MANAGER_TEAM_ID: ${{ inputs.manager_team_id }}
          MANAGER_STATE_JSON: ${{ inputs.manager_state_json }}
          SEASON: ${{ inputs.season }}
          TARGET_GAMEWEEK: ${{ inputs.gameweek }}
        run: |
          PYTHONPATH=scripts python scripts/capture_predeadline_decision_bundle.py \
            --team-id "$MANAGER_TEAM_ID" \
            --gameweek "$TARGET_GAMEWEEK" \
            --season "$SEASON" \
            --manager-state-json "$MANAGER_STATE_JSON" \
            --output predeadline-decision-evidence.json
      - name: Retrieve aggregate provisional field EO artifact
        if: inputs.field_eo_capture_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: provisional-field-eo-${{ inputs.field_eo_capture_run_id }}
          run-id: ${{ inputs.field_eo_capture_run_id }}
          github-token: ${{ github.token }}
          path: canonical_candidate/engineering_workbench/field-capture
      - name: Retrieve optional exploratory historical CoVar artifact
        if: inputs.covar_capture_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: cta-onside-covariance-${{ inputs.covar_capture_run_id }}
          run-id: ${{ inputs.covar_capture_run_id }}
          github-token: ${{ github.token }}
          path: canonical_candidate/engineering_workbench/covar-capture
      - name: Generate and freeze the single conventional recommendation
        working-directory: canonical_candidate/engineering_workbench
        env:
          M3_CODE_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          PYTHONPATH=scripts python scripts/run_predeadline_m3_decision.py \
            predeadline-decision-evidence.json \
            --software-commit "$M3_CODE_SHA" \
            ${{ inputs.field_eo_capture_run_id != '' && '--field-eo-csv field-capture/predeadline_field_eo.csv --field-eo-report field-capture/predeadline_field_report.json' || '' }} \
            ${{ inputs.covar_capture_run_id != '' && '--covariance-report covar-capture/fpl_covariance_report.json --covariance-pairs covar-capture/fpl_covariance_pairs.csv' || '' }} \
            --output predeadline-m3-recommendation.json
      - name: Independently re-execute the frozen decision from the captured bundle
        working-directory: canonical_candidate/engineering_workbench
        env:
          M3_CODE_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          PYTHONPATH=scripts python scripts/replay_frozen_m3_decision.py \
            predeadline-decision-evidence.json \
            predeadline-m3-recommendation.json \
            --software-commit "$M3_CODE_SHA" \
            ${{ inputs.field_eo_capture_run_id != '' && '--field-eo-csv field-capture/predeadline_field_eo.csv --field-eo-report field-capture/predeadline_field_report.json' || '' }} \
            ${{ inputs.covar_capture_run_id != '' && '--covariance-report covar-capture/fpl_covariance_report.json --covariance-pairs covar-capture/fpl_covariance_pairs.csv' || '' }} \
            --output predeadline-m3-replay-report.json
      - name: Upload pre-deadline decision evidence and recommendation
        uses: actions/upload-artifact@v4
        with:
          name: predeadline-decision-evidence-manager-${{ inputs.manager_team_id }}-gw${{ inputs.gameweek }}-run${{ github.run_id }}
          path: |
            canonical_candidate/engineering_workbench/predeadline-decision-evidence.json
            canonical_candidate/engineering_workbench/predeadline-m3-recommendation.json
            canonical_candidate/engineering_workbench/predeadline-m3-replay-report.json
          if-no-files-found: error
          retention-days: 90

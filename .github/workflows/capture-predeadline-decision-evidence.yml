name: Capture pre-deadline FPL decision evidence

on:
  workflow_dispatch:
    inputs:
      manager_team_id:
        description: FPL manager team ID
        required: true
        default: "421025"
        type: string
      gameweek:
        description: Upcoming target Gameweek
        required: true
        type: string
      season:
        description: FPL season label
        required: true
        default: "2026-27"
        type: string
      expected_element_ids:
        description: Optional exact 15 FPL element IDs for an extra check; leave blank to use the official manager picks response
        required: false
        default: ""
        type: string
      free_transfers:
        description: Free transfers available before the deadline
        required: true
        default: "1"
        type: string
      formation:
        description: Intended starting formation
        required: true
        default: "4-3-3"
        type: choice
        options:
          - "3-4-3"
          - "3-5-2"
          - "4-3-3"
          - "4-4-2"
          - "4-5-1"
          - "5-2-3"
          - "5-3-2"
          - "5-4-1"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M3 implementation
        uses: actions/checkout@v4
        with:
          ref: feat/m3-external-benchmark-decision-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run capture and admission contract tests
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python -m pip install pytest
          PYTHONPATH=scripts python -m pytest -q \
            tests/test_capture_predeadline_decision_bundle.py \
            tests/test_classify_historical_fpl_evidence.py \
            tests/test_audit_official_fpl_manager_batch.py
      - name: Capture and seal pre-deadline decision evidence
        working-directory: canonical_candidate/engineering_workbench
        run: |
          PYTHONPATH=scripts python scripts/capture_predeadline_decision_bundle.py \
            --team-id "${{ inputs.manager_team_id }}" \
            --gameweek "${{ inputs.gameweek }}" \
            --season "${{ inputs.season }}" \
            --expected-element-ids "${{ inputs.expected_element_ids }}" \
            --free-transfers "${{ inputs.free_transfers }}" \
            --formation "${{ inputs.formation }}" \
            --chip-state NONE \
            --output predeadline-decision-evidence.json
      - name: Upload immutable pre-deadline decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: predeadline-decision-evidence-manager-${{ inputs.manager_team_id }}-gw${{ inputs.gameweek }}
          path: canonical_candidate/engineering_workbench/predeadline-decision-evidence.json
          if-no-files-found: error
          retention-days: 90

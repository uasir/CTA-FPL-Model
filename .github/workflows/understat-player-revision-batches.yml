name: Understat complete player revision history batches
on:
  push:
    branches:
      - feat/2pm-defensive-2025-26-train-2026-27-oot
    paths:
      - .github/workflows/understat-player-revision-batches.yml
      - canonical_candidate/engineering_workbench/scripts/audit_2pm_understat_git_history.py
      - canonical_candidate/engineering_workbench/scripts/inventory_2pm_understat_player_population.py
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Zero-based batch index; 25 batches of 50 files cover 1,213 selected player histories"
        required: true
        default: "0"
        type: string
permissions:
  contents: read
concurrency:
  group: understat-player-revision-batch-\${{ inputs.batch_index }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install requests pandas
      - name: Restore pinned-source caches
        uses: actions/cache/restore@v4
        with:
          path: |
            \${{ runner.temp }}/understat-population-cache
            \${{ runner.temp }}/understat-revision-cache
          key: understat-player-revisions-v1-8c97b2adb123863c3dd581e730f1360e89815ac2-\${{ github.run_id }}
          restore-keys: |
            understat-player-revisions-v1-8c97b2adb123863c3dd581e730f1360e89815ac2-
      - name: Rebuild pinned population inventory
        run: |
          python canonical_candidate/engineering_workbench/scripts/inventory_2pm_understat_player_population.py \
            --cache-dir "$RUNNER_TEMP/understat-population-cache" \
            --output "$RUNNER_TEMP/player-population.json" \
            --detail-output "$RUNNER_TEMP/player-population.csv"
      - name: Prepare deterministic player-history batch
        env:
          BATCH_INDEX: \${{ inputs.batch_index }}
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          batch = int(os.environ["BATCH_INDEX"])
          if batch < 0 or batch >= 25:
              raise SystemExit(f"batch_index must be 0..24, got {batch}")
          with (root / "player-population.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          by_id = {}
          for row in rows:
              if row["selected_pinned_path"]:
                  by_id[int(row["understat_id"])] = {
                      "understat_id": int(row["understat_id"]),
                      "selected_pinned_tree_path": row["selected_pinned_path"],
                      "source_kind": "pinned_player_csv"
                  }
          players = sorted(by_id.values(), key=lambda x:(x["understat_id"],x["selected_pinned_tree_path"]))
          start = batch * 50
          selected = players[start:start+50]
          if not selected:
              raise SystemExit(f"empty batch {batch}; inventory has {len(players)} files")
          (root / "batch-inventory.json").write_text(json.dumps({"players":selected},indent=2))
          print(json.dumps({"batch_index":batch,"total_files":len(players),"offset":start,"batch_files":len(selected),"first":selected[0],"last":selected[-1]},indent=2))
          PY
      - name: Audit all player source revisions in this batch
        env:
          GITHUB_TOKEN: \${{ github.token }}
        run: |
          python canonical_candidate/engineering_workbench/scripts/audit_2pm_understat_git_history.py \
            --inventory "$RUNNER_TEMP/batch-inventory.json" \
            --pinned-commit "8c97b2adb123863c3dd581e730f1360e89815ac2" \
            --limit-player-files 50 \
            --player-offset 0 \
            --max-commits-per-file 1000 \
            --cache-dir "$RUNNER_TEMP/understat-revision-cache" \
            --output "$RUNNER_TEMP/player-revision-batch.json"
      - name: Validate complete batch and keep admission closed
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"player-revision-batch.json"
          r=json.loads(p.read_text())
          assert r["files_requested"] == r["files_audited"], r
          assert r["files_requested"] > 0, r
          assert r["admission_decision"] == "NO_FEATURES_ADMITTED", r
          failures=[]
          for x in r["results"]:
              if x.get("error") or x.get("errors") or x.get("history_truncated") or not x.get("row_history"):
                  failures.append({"path":x.get("source_path"),"error":x.get("error"),"errors":x.get("errors"),"truncated":x.get("history_truncated"),"rows":len(x.get("row_history",{}))})
          print(json.dumps({"files_requested":r["files_requested"],"files_audited":r["files_audited"],"files_with_errors":len(failures),"files_truncated":sum(bool(x.get("history_truncated")) for x in r["results"]),"row_count":sum(len(x.get("row_history",{})) for x in r["results"]),"revision_events":sum(sum(y.get("value_revision_count",0) for y in x.get("row_history",{}).values()) for x in r["results"]),"missing_events":sum(sum(y.get("missing_revision_count",0) for y in x.get("row_history",{}).values()) for x in r["results"]),"reappearances":sum(sum(y.get("reappearance_count",0) for y in x.get("row_history",{}).values()) for x in r["results"]),"failures":failures[:20]},indent=2))
          assert not failures, failures[:20]
          PY
      - name: Upload player revision batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: understat-player-revision-batch-\${{ inputs.batch_index }}
          path: |
            \${{ runner.temp }}/player-revision-batch.json
            \${{ runner.temp }}/batch-inventory.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save resumable source revision cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            \${{ runner.temp }}/understat-population-cache
            \${{ runner.temp }}/understat-revision-cache
          key: understat-player-revisions-v1-8c97b2adb123863c3dd581e730f1360e89815ac2-\${{ github.run_id }}

name: Replay conventional delivery from archived evidence

on:
  push:
    branches:
      - feat/m4-conventional-delivery-m3-aligned
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run containing the frozen pre-deadline evidence artifact
        required: true
        default: "44809552413"
        type: string
      artifact_name:
        description: Exact archived artifact name
        required: true
        default: "predeadline-decision-evidence-manager-421025-gw11"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected M4 implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the exact historical evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name || 'predeadline-decision-evidence-manager-421025-gw11' }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.source_run_id || '44809552413' }}
          github-token: ${{ github.token }}
          path: archived-evidence
      - name: Verify expected frozen inputs exist
        run: |
          test -s archived-evidence/predeadline-m3-recommendation.json
          test -s archived-evidence/predeadline-decision-evidence.json
          test -s archived-evidence/predeadline-m3-replay-report.json
      - name: Validate conventional M4 delivery contract
        working-directory: canonical_candidate/engineering_workbench
        run: |
          PYTHONPATH=scripts python scripts/m5_conventional_delivery_contract.py \
            --input "$GITHUB_WORKSPACE/archived-evidence/predeadline-m3-recommendation.json" \
            --output m4-conventional-delivery-acceptance.json
      - name: Build the conventional M4 delivery report
        working-directory: canonical_candidate/engineering_workbench
        run: |
          PYTHONPATH=scripts python scripts/m4_conventional_delivery_report.py \
            --conventional "$GITHUB_WORKSPACE/archived-evidence/predeadline-m3-recommendation.json" \
            --m3-replay-report "$GITHUB_WORKSPACE/archived-evidence/predeadline-m3-replay-report.json" \
            --decision-evidence "$GITHUB_WORKSPACE/archived-evidence/predeadline-decision-evidence.json" \
            --output m4-conventional-delivery-report.json
      - name: Require verified frozen M3 replay evidence
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("m4-conventional-delivery-report.json").read_text())
          if report.get("m3_replay_evidence", {}).get("status") != "VERIFIED":
              raise SystemExit("M3 replay evidence was not verified")
          guardrails = report.get("guardrails", {})
          if guardrails.get("frozen_m3_replay_verified") is not True:
              raise SystemExit("M4 delivery report did not preserve frozen M3 replay guardrail")
          required = {
              "release_eligible": False,
              "expected_points_unchanged": True,
              "frozen_decision_unchanged": True,
              "ev_eo_blended": False,
              "covar_decision_weight": 0,
              "field_context_can_change_recommendation": False,
          }
          for key, expected in required.items():
              if guardrails.get(key) != expected:
                  raise SystemExit(f"M4 delivery guardrail mismatch: {key}")
          if report.get("status") != "PASS_CONVENTIONAL_DELIVERY_WITH_OPTIONAL_FIELD_CONTEXT":
              raise SystemExit("Conventional M4 delivery report did not pass")
          PY
      - name: Write replay provenance manifest
        working-directory: canonical_candidate/engineering_workbench
        env:
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '44809552413' }}
          SOURCE_ARTIFACT_NAME: ${{ github.event.inputs.artifact_name || 'predeadline-decision-evidence-manager-421025-gw11' }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "archived-evidence"
          report = Path("m4-conventional-delivery-report.json")
          acceptance = Path("m4-conventional-delivery-acceptance.json")
          manifest = {
              "replay_type": "HISTORICAL_CONVENTIONAL_M4_DELIVERY",
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_name": os.environ["SOURCE_ARTIFACT_NAME"],
              "replay_software_commit": os.environ["SOURCE_COMMIT"],
              "source_files": {},
              "outputs": {},
              "release_eligible": False,
              "frozen_m3_replay_verified": json.loads(report.read_text()).get("m3_replay_evidence", {}).get("status") == "VERIFIED",
              "manager_specific_report_published": False,
              "full_report_retained_only_on_ephemeral_runner": True,
          }
          for name in (
              "predeadline-m3-recommendation.json",
              "predeadline-decision-evidence.json",
              "predeadline-m3-replay-report.json",
          ):
              data = (source / name).read_bytes()
              manifest["source_files"][name] = {
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size_bytes": len(data),
              }
          for name, path in (
              ("acceptance", acceptance),
              ("delivery_report", report),
          ):
              data = path.read_bytes()
              manifest["outputs"][name] = {
                  "file": path.name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size_bytes": len(data),
              }
          Path("m4-conventional-delivery-replay-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Upload privacy-safe conventional M4 validation manifest only
        uses: actions/upload-artifact@v4
        with:
          name: conventional-m4-validation-manifest-source-run-${{ github.event.inputs.source_run_id || '44809552413' }}
          path: canonical_candidate/engineering_workbench/m4-conventional-delivery-replay-manifest.json
          if-no-files-found: error
          retention-days: 90

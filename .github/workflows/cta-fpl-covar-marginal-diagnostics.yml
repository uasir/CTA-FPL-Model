name: CTA CoVar marginal forecast diagnostics

on:
  workflow_dispatch:
    inputs:
      panel_run_id:
        description: "Successful multi-Gameweek matched panel workflow run ID"
        required: true
        type: string
      panel_artifact_name:
        description: "Exact accumulated panel artifact name"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cta-covar-marginal-forecast-diagnostics
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostics evaluator
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source run and download panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PANEL_RUN_ID: ${{ inputs.panel_run_id }}
          PANEL_ARTIFACT_NAME: ${{ inputs.panel_artifact_name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          run = os.environ["PANEL_RUN_ID"].strip()
          name = os.environ["PANEL_ARTIFACT_NAME"].strip()
          if not re.fullmatch(r"[0-9]+", run):
              raise SystemExit("Panel run ID must be numeric.")
          if not name or "/" in name or "\\\\" in name:
              raise SystemExit("Artifact name must be an exact plain name.")
          info = json.loads(subprocess.check_output([
              "gh", "run", "view", run, "--repo", os.environ["GH_REPO"],
              "--json", "conclusion,status,workflowName,event",
          ], text=True))
          if (info.get("status") != "completed"
                  or info.get("conclusion") != "success"
                  or info.get("workflowName") != "CTA CoVar multi-Gameweek matched outcome panel"
                  or info.get("event") != "workflow_dispatch"):
              raise SystemExit("Source run is not a successful manual CoVar multi-Gameweek panel run.")
          dest = Path(os.environ["RUNNER_TEMP"]) / "matched-panel"
          dest.mkdir(mode=0o700)
          subprocess.run([
              "gh", "run", "download", run, "--repo", os.environ["GH_REPO"],
              "--name", name, "--dir", str(dest),
          ], check=True)
          if not list(dest.rglob("multi_gameweek_matched_panel.json")):
              raise SystemExit("Accumulated panel JSON was not found in artifact.")
          PY
      - name: Calculate marginal diagnostics with Gameweek-clustered intervals
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          PANEL=$(find "$RUNNER_TEMP/matched-panel" -type f -name multi_gameweek_matched_panel.json -print -quit)
          test -n "$PANEL"
          mkdir -m 700 -p "$RUNNER_TEMP/covar-marginal-diagnostics"
          python canonical_candidate/engineering_workbench/scripts/m4_covar_forecast_marginal_diagnostics.py \
            --panel "$PANEL" \
            --output "$RUNNER_TEMP/covar-marginal-diagnostics/marginal_diagnostics.json"
      - name: Upload research-only diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: cta-covar-marginal-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/covar-marginal-diagnostics/marginal_diagnostics.json
          if-no-files-found: error
          retention-days: 90

name: CTA FPL engineering CI

on:
  workflow_dispatch:
  push:
    branches: [main, "work/**", "fix/**", "docs/**", "feat/**"]
    paths:
      - .github/workflows/cta-fpl-ci.yml
      - .github/workflows/cta-fpl-ingestion.yml
      - .github/workflows/cta-fpl-eo-capture.yml
      - .github/workflows/cta-opta-pulselive-integration.yml
      - canonical_candidate/engineering_workbench/scripts/**
      - canonical_candidate/engineering_workbench/src/js/**
      - canonical_candidate/engineering_workbench/tests/**
      - canonical_candidate/engineering_workbench/docs/EXTERNAL_FPL_BENCHMARK_PROTOCOL.md
      - canonical_candidate/src/**
      - canonical_candidate/tests/**
      - canonical_candidate/data/11footy_fpl_identity_crosswalk.csv
      - canonical_candidate/data/player_identity_crosswalk.csv
      - canonical_candidate/data/wyscout_fpl_identity_crosswalk.csv
      - canonical_candidate/data/opta_pulselive_fpl_identity_crosswalk.csv

permissions:
  contents: read

concurrency:
  group: cta-fpl-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JavaScript recommendation contract tests
        working-directory: canonical_candidate/engineering_workbench
        run: node --test tests/js/*.test.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical Python feature-core tests
        working-directory: canonical_candidate
        run: python -m unittest discover -s tests -v
      - name: Install pytest
        run: python -m pip install pytest numpy
      - name: Run engineering tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts:src
        run: python -m pytest -q
      - name: Validate StatsBomb identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_player_identity_crosswalk.py \
            --input ../data/player_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/identity_crosswalk
      - name: Validate Wyscout to FPL identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider wyscout \
            --input ../data/wyscout_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/wyscout_identity
      - name: Validate Opta/PulseLive to FPL identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider opta_pulselive \
            --input ../data/opta_pulselive_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/opta_identity
      - name: Validate 11footy to FPL identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider 11footy \
            --input ../data/11footy_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/11footy_identity

  standalone_transformer_research:
    if: contains(github.event.head_commit.message, '[run-transformer]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm standalone model-track isolation
        run: echo "Training conventional FPL 2PM with lagged points, minutes and observed xG/xA only; test held-out monotone expected-points affine calibration; no A/B/C features."
      - name: Install standalone Transformer research dependencies
        run: |
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Transformer architecture and sequence tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts:src
        run: python -m pytest -q tests/test_two_pm_transformer.py tests/test_two_pm_transformer_walk_forward.py
      - name: Build runner-local multi-season conventional FPL panel
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts:src
        run: |
          python scripts/build_vaastav_fpl_multiseason_panel.py \
            --out-dir "$RUNNER_TEMP/cta_fpl_transformer_research"
      - name: Train and evaluate standalone 2PM-Transformer walk-forward
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts:src
        run: |
          python scripts/evaluate_two_pm_transformer_walk_forward.py \
            --input "$RUNNER_TEMP/cta_fpl_transformer_research/vaastav_fpl_multiseason_panel.csv" \
            --out "$RUNNER_TEMP/cta_fpl_transformer_research/standalone_2pm_transformer_report.json"
      - name: Confirm research data and player-level outputs remain private to runner
        run: |
          echo "Historical source data, player-level sequences and predictions remain runner-local."
          echo "Only aggregate workflow logs are retained; no research artifact is uploaded."

name: CTA FPL engineering CI

on:
  workflow_dispatch:
  push:
    branches: [main, "work/**", "fix/**", "docs/**", "feat/**"]
    paths:
      - .github/workflows/cta-fpl-ci.yml
      - .github/workflows/cta-fpl-retrospective-finality.yml
      - .github/workflows/cta-fpl-ingestion.yml
      - .github/workflows/cta-fpl-eo-capture.yml
      - .github/workflows/cta-fpl-predeadline-field-eo.yml
      - .github/workflows/cta-opta-pulselive-integration.yml
      - .github/workflows/capture-predeadline-decision-evidence.yml
      - .github/workflows/reconcile-official-fpl-manager.yml
      - canonical_candidate/engineering_workbench/scripts/**
      - canonical_candidate/engineering_workbench/src/js/**
      - canonical_candidate/engineering_workbench/tests/**
      - canonical_candidate/src/**
      - canonical_candidate/tests/**
      - canonical_candidate/data/11footy_fpl_identity_crosswalk.csv
      - canonical_candidate/data/player_identity_crosswalk.csv
      - canonical_candidate/data/wyscout_fpl_identity_crosswalk.csv
      - canonical_candidate/data/opta_pulselive_fpl_identity_crosswalk.csv

permissions:
  contents: read

concurrency:
  group: cta-fpl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JavaScript recommendation contract tests
        working-directory: canonical_candidate/engineering_workbench
        run: node --test tests/js/*.test.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical Python feature-core tests
        working-directory: canonical_candidate
        run: python -m unittest discover -s tests -v
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run engineering tests
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts:src
        run: |
          if [ -f scripts/evaluate_cta_abc_walk_forward.py ]; then
            python -m pytest -q
          else
            # M2's evaluator test is present on main before its implementation is merged.
            # Keep M3 independent while retaining that test automatically on M2 branches.
            python -m pytest -q --ignore=tests/test_evaluate_cta_abc_walk_forward.py
          fi
      - name: Validate StatsBomb identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_player_identity_crosswalk.py \
            --input ../data/player_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/identity_crosswalk
      - name: Validate Wyscout to FPL identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider wyscout \
            --input ../data/wyscout_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/wyscout_identity
      - name: Validate Opta/PulseLive to FPL identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider opta_pulselive \
            --input ../data/opta_pulselive_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/opta_identity
      - name: Validate 11footy to FPL identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider 11footy \
            --input ../data/11footy_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/11footy_identity

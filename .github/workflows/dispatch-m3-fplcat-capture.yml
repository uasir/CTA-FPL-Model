name: Dispatch M3 FPL Cat benchmark capture

on:
  workflow_dispatch:
    inputs:
      season:
        description: FPL season label
        required: true
        default: "2026-27"
      manager_team_id:
        description: Public FPL manager team ID
        required: true
        default: "421025"
      gameweek:
        description: Target gameweek
        required: true
        default: "12"
      expected_bank:
        description: Current manager bank in £m; required for pre-deadline fallback and official-picks cross-check
        required: true
        default: "1.8"
      free_transfers:
        description: Confirmed free transfers available for the target Gameweek
        required: true
        default: "1"
      starting_xi_ids:
        description: Manager-confirmed baseline starting XI element IDs for the target Gameweek (comma-separated)
        required: true
        default: "8,31,79,110,115,124,154,166,411,426,504"
      expected_element_ids:
        description: Manager-confirmed current 15-player squad FPL element IDs for the target Gameweek (comma-separated)
        required: true
        default: "8,31,79,110,115,124,154,166,183,282,411,426,497,504,524"

permissions:
  contents: read

concurrency:
  group: m3-fplcat-benchmark-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout M3 implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-external-benchmark-decision-engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture FPL Cat and official FPL metadata
        working-directory: canonical_candidate/engineering_workbench
        run: |
          set -euo pipefail
          python scripts/capture_fpl_cat_snapshot.py \
            --season "${{ inputs.season }}" \
            --output "artifacts/fplcat/fplcat-${{ inputs.season }}-snapshot.json"

      - name: Capture official manager picks or user-confirmed pre-deadline squad
        working-directory: canonical_candidate/engineering_workbench
        run: |
          set -euo pipefail
          python scripts/capture_fpl_manager_context.py \
            --team-id "${{ inputs.manager_team_id }}" \
            --gameweek "${{ inputs.gameweek }}" \
            --expected-bank "${{ inputs.expected_bank }}" \
            --free-transfers "${{ inputs.free_transfers }}" \
            --personal-risk-profile "aggressive" \
            --allow-user-confirmed-fallback \
            --formation "4-3-3" \
            --starting-xi-ids "${{ inputs.starting_xi_ids }}" \
            --expected-element-ids "${{ inputs.expected_element_ids }}" \
            --output "artifacts/fplcat/manager-context-${{ inputs.gameweek }}-${{ github.run_id }}.json"

      - name: Assemble the benchmark-backed decision input
        working-directory: canonical_candidate/engineering_workbench
        run: |
          set -euo pipefail
          python scripts/assemble_external_benchmark_decision_input.py \
            --provider-capture "artifacts/fplcat/fplcat-${{ inputs.season }}-snapshot.json" \
            --manager-capture "artifacts/fplcat/manager-context-${{ inputs.gameweek }}-${{ github.run_id }}.json" \
            --output "artifacts/fplcat/decision-input-${{ inputs.gameweek }}-${{ github.run_id }}.json"

      - name: Run one conventional personal-squad recommendation
        working-directory: canonical_candidate/engineering_workbench
        run: |
          set -euo pipefail
          python scripts/run_external_benchmark_personal_squad.py \
            "artifacts/fplcat/decision-input-${{ inputs.gameweek }}-${{ github.run_id }}.json" \
            --output "artifacts/fplcat/recommendation-${{ inputs.gameweek }}-${{ github.run_id }}.json"

      - name: Upload immutable capture and decision bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fplcat-manager-context-${{ inputs.gameweek }}-${{ github.run_id }}
          path: canonical_candidate/engineering_workbench/artifacts/fplcat/*.json
          if-no-files-found: warn
          retention-days: 90

name: 2PM Dastan 286 corrected-identity candidate rebuild

on:
  workflow_dispatch:
    inputs:
      rebuild_candidate:
        description: "Rebuild the six-season candidate (2020/21–2025/26) from raw sources (normally leave false)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cta-2pm-dastan-286-candidate-rebuild-current
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Check out pinned Dastan source
        uses: actions/checkout@v4
        with:
          repository: qazybekb/smartplayfpl-dastan
          ref: 758db9247e8b3a9a870c991064f74d8339d61cd0
          path: dastan-source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned Dastan raw-source cache
        id: raw-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/2pm-dastan-raw
          key: 2pm-dastan-raw-v3-${{ hashFiles('dastan-source/data/source_pins.json') }}-${{ hashFiles('dastan-source/data/mappings/fpl_understat_training_snapshot.csv', 'dastan-source/data/mappings/fpl_understat_players.csv', 'dastan-source/data/mappings/fpl_understat_current.csv') }}
          restore-keys: |
            2pm-dastan-raw-v3-${{ hashFiles('dastan-source/data/source_pins.json') }}-
      - name: Restore completed six-season candidate cache
        id: candidate-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/2pm-dastan-candidate
          key: 2pm-dastan-candidate-v3-2020-21-through-2025-26-${{ hashFiles('canonical_candidate/engineering_workbench/scripts/rebuild_2pm_dastan_286_candidate.py', 'canonical_candidate/engineering_workbench/scripts/rebuild_2pm_fixture_context.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_predeadline_market_snapshot.py', 'canonical_candidate/engineering_workbench/config/2pm_dastan_286_schema.json', 'dastan-source/data/source_pins.json', 'dastan-source/data/mappings/fpl_understat_training_snapshot.csv', 'dastan-source/data/mappings/fpl_understat_players.csv', 'dastan-source/data/mappings/fpl_understat_current.csv') }}
          restore-keys: |
            2pm-dastan-candidate-v3-2020-21-through-2025-26-
      - name: Require reusable six-season candidate unless rebuild is explicitly approved
        if: inputs.rebuild_candidate != true
        run: |
          if [ ! -f "$RUNNER_TEMP/2pm-dastan-candidate/player_matches_with_availability.parquet" ] || [ ! -f "$RUNNER_TEMP/2pm-dastan-candidate/2pm_dastan_286_candidate_report.json" ] || [ ! -f "$RUNNER_TEMP/2pm-dastan-candidate/features_286_candidate.parquet" ]; then
            echo "::error::No reusable six-season candidate cache was restored. Refusing to rebuild because rebuild_candidate is false."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import os
          import pyarrow.parquet as pq

          path = Path(os.environ["RUNNER_TEMP"]) / "2pm-dastan-candidate" / "features_286_candidate.parquet"
          parquet = pq.ParquetFile(path)
          sidecars = [name for name in parquet.schema.names if name.startswith("__observed__")]
          if len(sidecars) != 286:
              raise SystemExit(
                  f"Cached candidate has {len(sidecars)} raw-source observation sidecars; expected 286. "
                  "Set rebuild_candidate=true to regenerate them from raw sources."
              )
          for batch in parquet.iter_batches(batch_size=65536, columns=sidecars):
              values = batch.to_pandas()
              if values.isna().any().any() or not values.isin([0, 1]).all().all():
                  raise SystemExit("Cached candidate contains invalid raw-source observation sidecars.")
          print("Validated all 286 raw-source observation sidecars in reusable candidate cache.")
          PY
          echo "Reusable candidate cache restored; downstream audit only. No six-season rebuild will run."
      - name: Install tensor and reconstruction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow scipy==1.16.3 understatapi==0.7.1
      - name: Rebuild six-season corrected-identity 286-feature candidate
        if: steps.candidate-cache.outputs.cache-hit != 'true' && inputs.rebuild_candidate == true
        working-directory: canonical_candidate/engineering_workbench
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/rebuild_2pm_dastan_286_candidate.py \
            --dastan-root "$GITHUB_WORKSPACE/dastan-source" \
            --raw-dir "$RUNNER_TEMP/2pm-dastan-raw" \
            --output-dir "$RUNNER_TEMP/2pm-dastan-candidate" \
            --seasons 2020-21,2021-22,2022-23,2023-24,2024-25,2025-26 \
            --workers 12 \
            --allow-missing-understat \
            > "$RUNNER_TEMP/2pm-dastan-rebuild.log"
      - name: Save completed candidate for downstream-only reruns
        if: success() && steps.candidate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/2pm-dastan-candidate
          key: 2pm-dastan-candidate-v3-2020-21-through-2025-26-${{ hashFiles('canonical_candidate/engineering_workbench/scripts/rebuild_2pm_dastan_286_candidate.py', 'canonical_candidate/engineering_workbench/scripts/rebuild_2pm_fixture_context.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_predeadline_market_snapshot.py', 'canonical_candidate/engineering_workbench/config/2pm_dastan_286_schema.json', 'dastan-source/data/source_pins.json', 'dastan-source/data/mappings/fpl_understat_training_snapshot.csv', 'dastan-source/data/mappings/fpl_understat_players.csv', 'dastan-source/data/mappings/fpl_understat_current.csv') }}
      - name: Audit defensive source coverage from cached six-season data
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from rebuild_2pm_dastan_286_candidate import audit_defensive_source_coverage
          root = Path(__import__("os").environ["RUNNER_TEMP"])
          raw_dir = root / "2pm-dastan-raw"
          candidate_dir = root / "2pm-dastan-candidate"
          matches = pd.read_parquet(candidate_dir / "player_matches_with_availability.parquet")
          report = json.loads((candidate_dir / "2pm_dastan_286_candidate_report.json").read_text())
          seasons = ["2020-21", "2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]
          report["defensive_source_coverage"] = audit_defensive_source_coverage(raw_dir, seasons, matches)
          report["defensive_source_coverage_audit_mode"] = "CACHED_RAW_SOURCE_AND_EXISTING_PLAYER_MATCHES_NO_REBUILD"
          (candidate_dir / "2pm_dastan_286_candidate_report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report["defensive_source_coverage"], indent=2))
          PY
      - name: Restore partial grouped tensor build cache
        id: tensor-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/2pm-dastan-candidate/postmatch-grouped-dataset
          key: 2pm-dastan-grouped-tensors-v1-${{ hashFiles('canonical_candidate/engineering_workbench/scripts/build_2pm_postmatch_grouped_dataset.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_player_gameweek_sequence_tensors.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_postmatch_state_vectors.py', 'canonical_candidate/engineering_workbench/config/2pm_dastan_286_schema.json', 'dastan-source/data/source_pins.json', 'dastan-source/data/mappings/fpl_understat_training_snapshot.csv', 'dastan-source/data/mappings/fpl_understat_players.csv', 'dastan-source/data/mappings/fpl_understat_current.csv') }}-${{ github.run_id }}
          restore-keys: |
            2pm-dastan-grouped-tensors-v1-${{ hashFiles('canonical_candidate/engineering_workbench/scripts/build_2pm_postmatch_grouped_dataset.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_player_gameweek_sequence_tensors.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_postmatch_state_vectors.py', 'canonical_candidate/engineering_workbench/config/2pm_dastan_286_schema.json', 'dastan-source/data/source_pins.json', 'dastan-source/data/mappings/fpl_understat_training_snapshot.csv', 'dastan-source/data/mappings/fpl_understat_players.csv', 'dastan-source/data/mappings/fpl_understat_current.csv') }}-
      - name: Enforce official-deadline snapshot safety on candidate features
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/sanitize_2pm_candidate_snapshot_provenance.py \
            --input "$RUNNER_TEMP/2pm-dastan-candidate/features_286_candidate.parquet" \
            --report "$RUNNER_TEMP/2pm-dastan-candidate/snapshot_provenance_sanitization.json" \
            --safety-buffer-minutes 5
      - name: Audit candidate frame and build post-match player-Gameweek tensors
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/audit_2pm_dastan_286_candidate.py \
            --input "$RUNNER_TEMP/2pm-dastan-candidate/features_286_candidate.parquet" \
            --out "$RUNNER_TEMP/2pm-dastan-candidate/2pm_dastan_286_structural_audit.json"
          python scripts/build_2pm_postmatch_grouped_dataset.py \
            --dastan-root "$GITHUB_WORKSPACE/dastan-source" \
            --candidate "$RUNNER_TEMP/2pm-dastan-candidate/features_286_candidate.parquet" \
            --player-matches "$RUNNER_TEMP/2pm-dastan-candidate/player_matches_with_availability.parquet" \
            --team-matches "$RUNNER_TEMP/2pm-dastan-candidate/team_matches.parquet" \
            --output-dir "$RUNNER_TEMP/2pm-dastan-candidate/postmatch-grouped-dataset" \
            > "$RUNNER_TEMP/2pm-dastan-candidate/postmatch_grouped_dataset_report.json"
          python scripts/audit_2pm_grouped_tensor_artifacts.py \
            --dataset-dir "$RUNNER_TEMP/2pm-dastan-candidate/postmatch-grouped-dataset" \
            --out "$RUNNER_TEMP/2pm-dastan-candidate/postmatch-grouped-dataset/tensor_artifact_integrity_audit.json"
      - name: Publish candidate status and tensor integrity summary
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/2pm-dastan-candidate/2pm_dastan_286_candidate_report.json
          LOG_PATH: ${{ runner.temp }}/2pm-dastan-rebuild.log
          AUDIT_PATH: ${{ runner.temp }}/2pm-dastan-candidate/2pm_dastan_286_structural_audit.json
          SNAPSHOT_SANITIZATION_PATH: ${{ runner.temp }}/2pm-dastan-candidate/snapshot_provenance_sanitization.json
          TENSOR_REPORT_PATH: ${{ runner.temp }}/2pm-dastan-candidate/postmatch-grouped-dataset/postmatch_grouped_dataset_report.json
          TENSOR_AUDIT_PATH: ${{ runner.temp }}/2pm-dastan-candidate/postmatch-grouped-dataset/tensor_artifact_integrity_audit.json
          SUMMARY_PATH: ${{ runner.temp }}/2pm-dastan-step-summary.md
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = Path(os.environ["SUMMARY_PATH"])
          report_path = Path(os.environ["REPORT_PATH"])
          if report_path.exists():
              report = json.loads(report_path.read_text())
              lines = [
                  "## 2PM Dastan 286 candidate rebuild",
                  "- Dataset scope: all six historical seasons (2020/21–2025/26), all eligible seasons included in final model refit.",
                  "- Intended chronological use: expanding-season walk-forward validation across 2021/22–2025/26; final refit on all eligible 2020/21–2025/26 data; sealed OOT 2026/27.",
                  f"- Status: **{report.get('status')}**",
                  f"- Admission: **{report.get('admission_status')}**",
                  f"- Candidate rows: {report.get('candidate_rows')}",
                  f"- Player-fixture rows excluded from forecast targets as already started: {report.get('deadline_target_eligibility', {}).get('rows_excluded_started_by_deadline')}",
                  f"- Feature count: {report.get('candidate_feature_count')}",
                  f"- Seasons: {', '.join(report.get('seasons', []))}",
                  f"- Feature-order SHA-256: `{report.get('feature_order_sha256')}`",
                  f"- Candidate SHA-256: `{report.get('candidate_sha256')}`",
                  f"- Accepted pre-deadline market snapshot rows: {report.get('pre_deadline_snapshot_rows', {}).get('market')}",
                  f"- Market retrospective parity rows compared: {report.get('market_value_parity_audit', {}).get('rows_compared')}",
                  f"- Understat mapped played rows: {report.get('understat_player_coverage', {}).get('mapped_played_player_fixture_rows')}",
                  f"- Understat player IDs with no xG history: {report.get('understat_player_coverage', {}).get('mapped_player_ids_with_no_xG_history')}",
                  f"- Understat xG row coverage: {report.get('understat_player_coverage', {}).get('metric_coverage', {}).get('us_xG', {}).get('coverage_rate')}",
                  "- Defensive source-column coverage audit (pinned Vaastav files):",
                  *[
                      f"  - {season}: " + "; ".join(
                          f"{field}={'present' if values.get('source_column_present') else 'ABSENT'}, "
                          f"finite={values.get('finite_values')}, missing={values.get('missing_values')}, "
                          f"zero={values.get('observed_zero_values')}, nonzero={values.get('observed_nonzero_values')}"
                          for field, values in season_report.get("source_column_audit", {}).items()
                      )
                      for season, season_report in report.get("defensive_source_coverage", {}).get("seasons", {}).items()
                  ],
                  f"- Player rolling/availability/defensive features rebuilt: {report.get('player_history_reconstruction', {}).get('player_rolling_feature_count')} / {report.get('player_history_reconstruction', {}).get('availability_feature_count')} / {report.get('player_history_reconstruction', {}).get('defensive_player_history_feature_count')}",
                  f"- Deadline team snapshots reconstructed: {report.get('deadline_team_context_reconstruction', {}).get('team_deadline_snapshots_built')}",
                  f"- Own/opponent rolling team features rebuilt: {report.get('deadline_team_context_reconstruction', {}).get('team_feature_count')} / {report.get('deadline_team_context_reconstruction', {}).get('opponent_feature_count')}",
                  f"- Fixture-context fields rebuilt: {len(report.get('fixture_context_reconstruction', {}).get('fixture_context_columns', []))}",
                  f"- 286-family reconstruction coverage: {report.get('reconstruction_coverage', {}).get('reconstruction_path_total')}/286",
                  "- The full candidate feature frame and raw source files remain runner-local; grouped tensor shards and audit reports are uploaded as a 30-day artifact.",
                  "- This is a candidate rebuild, not point-in-time admission or model training.",
                  "- Season split defines the intended research evaluation; no model fitting or evaluation is performed by this workflow."
              ]
              sanitization_path = Path(os.environ["SNAPSHOT_SANITIZATION_PATH"])
              if sanitization_path.exists():
                  sanitization = json.loads(sanitization_path.read_text())
                  lines.append("- Snapshot provenance safety sanitization (official deadline, five-minute buffer):")
                  for name, values in sanitization.get("groups", {}).items():
                      lines.append(f"  - {name}: {values.get('rows_invalidated')} rows invalidated; {values.get('rows_retained')} retained")
              audit_path = Path(os.environ["AUDIT_PATH"])
              if audit_path.exists():
                  audit = json.loads(audit_path.read_text())
                  anchor = audit.get("same_player_gameweek_upstream_anchor_check", {})
                  lines.extend([
                      f"- Structural audit non-finite values: {audit.get('nonfinite_feature_values')}",
                      f"- Selected-prefix same-player/GW groups with differences: {anchor.get('groups_with_differences')}",
                      f"- Historical ep_next snapshots after deadline: {audit.get('snapshot_timestamps', {}).get('ep_next_snapshot_at', {}).get('post_deadline_rows')}",
                      f"- Historical market snapshots after deadline: {audit.get('snapshot_timestamps', {}).get('market_snapshot_at', {}).get('post_deadline_rows')}",
                      f"- Market snapshots inside five-minute safety buffer: {audit.get('snapshot_timestamps', {}).get('market_snapshot_at', {}).get('rows_under_5m_buffer')}"
                  ])
              tensor_path = Path(os.environ["TENSOR_REPORT_PATH"])
              if tensor_path.exists():
                  tensor = json.loads(tensor_path.read_text())
                  lines.extend([
                      f"- Post-match state rows: {tensor.get('postmatch_state_rows')}",
                      f"- Season/Gameweek groups processed: {tensor.get('season_gameweek_groups_processed')}",
                  f"- Player-Gameweek candidate groups considered: {tensor.get('player_gameweek_candidate_groups_considered')}",
                  f"- Player-Gameweek exclusion counts: {tensor.get('player_gameweek_exclusions')}",
                      f"- Five-match sequence samples emitted: {tensor.get('player_gameweek_samples_emitted')}",
                      f"- Grouped tensor build admission: {tensor.get('admission_status')}",
                      "- Tensors use five post-match played-fixture states plus one pre-deadline query per target fixture.",
                      "- Candidate sequences are not admitted for model training."
                  ])
              tensor_audit_path = Path(os.environ["TENSOR_AUDIT_PATH"])
              if tensor_audit_path.exists():
                  tensor_audit = json.loads(tensor_audit_path.read_text())
                  lines.extend([
                      f"- Tensor artifact integrity audit: **{tensor_audit.get('status')}**",
                      f"- Audited tensor samples / valid fixture queries: {tensor_audit.get('samples')} / {tensor_audit.get('valid_fixture_queries')}",
                      f"- Preserved feature NaN rate (fold-only imputation required): {tensor_audit.get('nan_feature_rate')}",
                  ])
              summary.write_text("\n".join(lines) + "\n")
          else:
              log = Path(os.environ["LOG_PATH"])
              tail = "\n".join(log.read_text(errors="replace").splitlines()[-30:]) if log.exists() else "No rebuild log was produced."
              summary.write_text("## 2PM Dastan 286 candidate rebuild\n\nRebuild did not produce a candidate report.\n\n```text\n" + tail + "\n```\n")
          PY
          cat "$RUNNER_TEMP/2pm-dastan-step-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 2PM tensor dataset and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2pm-six-season-tensor-candidate-run-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/2pm-dastan-candidate/postmatch-grouped-dataset/
            ${{ runner.temp }}/2pm-dastan-candidate/2pm_dastan_286_structural_audit.json
            ${{ runner.temp }}/2pm-dastan-candidate/snapshot_provenance_sanitization.json
            ${{ runner.temp }}/2pm-dastan-candidate/2pm_dastan_286_candidate_report.json
            ${{ runner.temp }}/2pm-dastan-step-summary.md
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
      - name: Save resumable grouped tensor build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/2pm-dastan-candidate/postmatch-grouped-dataset
          key: 2pm-dastan-grouped-tensors-v1-${{ hashFiles('canonical_candidate/engineering_workbench/scripts/build_2pm_postmatch_grouped_dataset.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_player_gameweek_sequence_tensors.py', 'canonical_candidate/engineering_workbench/scripts/build_2pm_postmatch_state_vectors.py', 'canonical_candidate/engineering_workbench/config/2pm_dastan_286_schema.json', 'dastan-source/data/source_pins.json', 'dastan-source/data/mappings/fpl_understat_training_snapshot.csv', 'dastan-source/data/mappings/fpl_understat_players.csv', 'dastan-source/data/mappings/fpl_understat_current.csv') }}-${{ github.run_id }}
      - name: Save pinned Dastan raw-source cache
        if: always() && steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/2pm-dastan-raw
          key: 2pm-dastan-raw-v3-${{ hashFiles('dastan-source/data/source_pins.json') }}-${{ hashFiles('dastan-source/data/mappings/fpl_understat_training_snapshot.csv', 'dastan-source/data/mappings/fpl_understat_players.csv', 'dastan-source/data/mappings/fpl_understat_current.csv') }}

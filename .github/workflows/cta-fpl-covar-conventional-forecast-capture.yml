name: CTA CoVar conventional forecast point-in-time capture

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "FPL season label"
        required: true
        default: "2026-27"
        type: string
  push:
    branches: ["feat/m4-field-portfolio-intelligence"]
    paths:
      - .github/workflows/cta-fpl-covar-conventional-forecast-capture.yml
      - canonical_candidate/engineering_workbench/scripts/m4_covar_conventional_forecast_capture.py

permissions:
  contents: read

concurrency:
  group: cta-covar-conventional-forecast-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout M4 implementation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture and validate conventional M3-compatible forecast
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
          SEASON: ${{ inputs.season || '2026-27' }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/covar-conventional-forecast"
          python scripts/m4_covar_conventional_forecast_capture.py \
            --season "$SEASON" \
            --output "$RUNNER_TEMP/covar-conventional-forecast/conventional_forecast.json"
          chmod 600 "$RUNNER_TEMP/covar-conventional-forecast/conventional_forecast.json"
      - name: Publish sanitized public-source forecast archive
        uses: actions/upload-artifact@v4
        with:
          name: cta-covar-conventional-forecast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/covar-conventional-forecast/conventional_forecast.json
          if-no-files-found: error
          retention-days: 90

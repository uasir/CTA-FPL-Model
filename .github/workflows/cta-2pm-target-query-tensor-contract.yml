name: 2PM target-query tensor contract

on:
  push:
    branches: ["feat/four-layer-2pm-transformer-evaluation", "feat/2pm-defensive-2025-26-train-2026-27-oot"]
    paths:
      - canonical_candidate/engineering_workbench/scripts/build_2pm_target_query_tensors.py
      - canonical_candidate/engineering_workbench/tests/test_2pm_target_query_tensors.py
      - .github/workflows/cta-2pm-target-query-tensor-contract.yml

permissions:
  contents: read

jobs:
  target-tensor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pandas pyarrow pytest
      - name: Compile target-query tensor builder
        working-directory: canonical_candidate/engineering_workbench
        run: python -m py_compile scripts/build_2pm_target_query_tensors.py
      - name: Test target-only inference tensors
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q tests/test_2pm_target_query_tensors.py

name: Capture FPL Cat benchmark snapshot

on:
  workflow_dispatch:
    inputs:
      season:
        description: FPL season label
        required: true
        default: "2026-27"

permissions:
  contents: read

concurrency:
  group: fplcat-benchmark-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture FPL Cat and official FPL metadata
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/capture_fpl_cat_snapshot.py \
            --season "${{ inputs.season }}" \
            --output "artifacts/fplcat/fplcat-${{ inputs.season }}-snapshot.json"

      - name: Upload immutable capture bundle
        uses: actions/upload-artifact@v4
        with:
          name: fplcat-${{ inputs.season }}-${{ github.run_id }}
          path: canonical_candidate/engineering_workbench/artifacts/fplcat/*.json
          if-no-files-found: error
          retention-days: 90

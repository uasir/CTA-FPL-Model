name: CTA Opta/PulseLive to FPL integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cta-opta-pulselive-integration.yml
      - canonical_candidate/engineering_workbench/scripts/build_opta_lagged_team_features.py
      - canonical_candidate/engineering_workbench/scripts/validate_provider_identity_crosswalk.py
      - canonical_candidate/data/opta_pulselive_fpl_identity_crosswalk.csv
  schedule:
    - cron: "10 6 * * *"

permissions:
  contents: read

concurrency:
  group: cta-opta-fpl-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch official FPL and pinned Opta/PulseLive snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/opta_fpl/source run_artifacts/opta_fpl/output
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            -H "User-Agent: CTA-FPL-Model/1.0" \
            https://fantasy.premierleague.com/api/bootstrap-static/ \
            -o run_artifacts/opta_fpl/source/bootstrap-static.json
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            -H "User-Agent: CTA-FPL-Model/1.0" \
            https://fantasy.premierleague.com/api/fixtures/ \
            -o run_artifacts/opta_fpl/source/fixtures.json
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/imadeddine-belkat/Premier-League-Stats/f0f3d40f803c69bc7fac48d0748b49175e2d08ce/pl_stats/_merged/players/2026-27_players_stats.csv \
            -o run_artifacts/opta_fpl/source/opta_players.csv
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/imadeddine-belkat/Premier-League-Stats/f0f3d40f803c69bc7fac48d0748b49175e2d08ce/pl_stats/_merged/events/2026-27_events_stats.csv \
            -o run_artifacts/opta_fpl/source/opta_team_events.csv
      - name: Record pinned source snapshot hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path("run_artifacts/opta_fpl/source")
          files = {
              "official_fpl_bootstrap": "bootstrap-static.json",
              "official_fpl_fixtures": "fixtures.json",
              "opta_pulselive_players": "opta_players.csv",
              "opta_pulselive_team_events": "opta_team_events.csv",
          }
          manifest = {
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "opta_source_commit": "f0f3d40f803c69bc7fac48d0748b49175e2d08ce",
              "files": {
                  name: {
                      "path": filename,
                      "bytes": (root / filename).stat().st_size,
                      "sha256": hashlib.sha256((root / filename).read_bytes()).hexdigest(),
                  } for name, filename in files.items()
              },
          }
          (Path("run_artifacts/opta_fpl/output") / "source_manifest.json").write_text(
              json.dumps(manifest, indent=2)
          )
          print(json.dumps(manifest, indent=2))
          PY
      - name: Build numeric identity crosswalk and strictly lagged team features
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/build_opta_lagged_team_features.py \
            --bootstrap ../../run_artifacts/opta_fpl/source/bootstrap-static.json \
            --fixtures ../../run_artifacts/opta_fpl/source/fixtures.json \
            --opta-players ../../run_artifacts/opta_fpl/source/opta_players.csv \
            --opta-team-events ../../run_artifacts/opta_fpl/source/opta_team_events.csv \
            --out-dir ../../run_artifacts/opta_fpl/output
      - name: Validate generated provider identity crosswalk
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/validate_provider_identity_crosswalk.py \
            --provider opta_pulselive \
            --input ../../run_artifacts/opta_fpl/output/opta_pulselive_fpl_identity_crosswalk.csv \
            --out-dir ../../run_artifacts/opta_fpl/output/crosswalk_validation
      - name: Enforce identity and fixture integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("run_artifacts/opta_fpl/output")
          report = json.loads((root / "opta_fpl_integration_report.json").read_text())
          validation = json.loads((root / "crosswalk_validation/crosswalk_validation.json").read_text())
          identity = report["identity"]
          features = report["team_features"]
          failures = []
          if identity["status"] != "PASS":
              failures.append("Opta/FPL numeric identity or team-ID reconciliation is not complete")
          if validation["status"] != "PASS" or not validation["join_ready"]:
              failures.append("Generated provider crosswalk did not pass the strict validator")
          if features["provider_match_ids_not_in_fpl_fixture_list"]:
              failures.append("Provider match IDs do not reconcile to FPL fixtures")
          if features["provider_matches_with_team_count_not_equal_to_two"]:
              failures.append("Provider match does not contain exactly two team rows")
          if features["provider_team_ids_not_in_fpl_bootstrap"]:
              failures.append("Provider team IDs do not reconcile to FPL teams")
          if failures:
              raise SystemExit("\\n".join(failures))
          print("PASS: numeric identity, team IDs, match IDs, and team-row cardinality")
          PY
      - name: Publish aggregate integration status only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("run_artifacts/opta_fpl/output")
          report = json.loads((root / "opta_fpl_integration_report.json").read_text())
          validation = json.loads((root / "crosswalk_validation/crosswalk_validation.json").read_text())
          identity = report["identity"]
          features = report["team_features"]
          source_manifest = json.loads((root / "source_manifest.json").read_text())
          safe = {
              "source_commit": identity["source_commit"],
              "source_manifest": source_manifest,
              "identity": {
                  key: identity[key] for key in (
                      "season", "fpl_unique_codes", "provider_unique_player_ids",
                      "exact_shared_numeric_ids", "verified_id_and_team_matches",
                      "team_mismatches_or_duplicate_ids",
                      "fpl_players_without_provider_season_row",
                      "provider_players_without_fpl_code", "status"
                  )
              },
              "crosswalk_validation": {
                  key: validation[key] for key in (
                      "input_rows", "verified_rows_accepted", "non_verified_rows_excluded",
                      "status_counts", "status", "join_ready"
                  )
              },
              "team_features": features,
              "publication_policy": "Aggregate report only; raw provider data, player crosswalk, and player-fixture rows are not uploaded."
          }
          (root / "opta_fpl_integration_summary.json").write_text(json.dumps(safe, indent=2))
          print(json.dumps(safe, indent=2))
          PY
      - name: Upload aggregate integration summary
        uses: actions/upload-artifact@v4
        with:
          name: cta-opta-fpl-integration-${{ github.run_id }}
          path: run_artifacts/opta_fpl/output/opta_fpl_integration_summary.json
          if-no-files-found: error
          retention-days: 90

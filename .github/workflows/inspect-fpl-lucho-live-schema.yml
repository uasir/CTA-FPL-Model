name: Inspect FPL Lucho live CSV schema (ephemeral)

on:
  push:
    branches:
      - feat/m3-external-benchmark-decision-engine
    paths:
      - "canonical_candidate/engineering_workbench/scripts/inspect_fpl_lucho_live_schema.py"
      - ".github/workflows/inspect-fpl-lucho-live-schema.yml"

permissions:
  contents: read

jobs:
  inspect-live-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CTA-FPL-Model
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download live CSV and emit schema only
        working-directory: canonical_candidate/engineering_workbench
        run: python scripts/inspect_fpl_lucho_live_schema.py

name: 2PM paper Poisson-mixture model contract

on:
  push:
    branches: ["feat/four-layer-2pm-transformer-evaluation"]
    paths:
      - canonical_candidate/engineering_workbench/scripts/two_component_poisson_transformer.py
      - canonical_candidate/engineering_workbench/tests/test_two_component_poisson_transformer.py
      - canonical_candidate/engineering_workbench/config/2pm_poisson_transformer_candidate.json
      - .github/workflows/cta-2pm-poisson-model-contract.yml

permissions:
  contents: read

jobs:
  model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch CPU and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Compile clean paper model
        working-directory: canonical_candidate/engineering_workbench
        run: python -m py_compile scripts/two_component_poisson_transformer.py
      - name: Test Poisson-mixture architecture, NLL and target transformation
        working-directory: canonical_candidate/engineering_workbench
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q tests/test_two_component_poisson_transformer.py

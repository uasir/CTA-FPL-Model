name: Reconcile official FPL manager Gameweeks

on:
  workflow_dispatch:
    inputs:
      gameweeks:
        description: Comma-separated completed Gameweeks to reconcile (e.g. 1,2,3,4,5,6,7,8,10)
        required: true
        default: "1,2,3,4,5,6,7,8,10"
        type: string
      manager_team_id:
        description: FPL manager team ID (public workflow input)
        required: true
        type: string
      decision_evidence_run_id:
        description: Optional successful pre-deadline capture workflow run ID for this manager and single Gameweek
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested Gameweeks and optional decision-evidence scope
        env:
          TARGET_GAMEWEEKS: ${{ inputs.gameweeks }}
          DECISION_EVIDENCE_RUN_ID: ${{ inputs.decision_evidence_run_id }}
        run: |
          python - <<'PY'
          import os
          raw = os.environ["TARGET_GAMEWEEKS"]
          parts = [part.strip() for part in raw.split(",")]
          if not parts or any(not part.isdigit() for part in parts):
              raise SystemExit("Gameweeks must be comma-separated positive integers")
          values = [int(part) for part in parts]
          if any(value < 1 or value > 38 for value in values) or len(set(values)) != len(values):
              raise SystemExit("Gameweeks must be unique integers from 1 through 38")
          run_id = os.environ.get("DECISION_EVIDENCE_RUN_ID", "").strip()
          if run_id and (len(values) != 1 or not run_id.isdigit() or int(run_id) < 1):
              raise SystemExit("Decision evidence requires one Gameweek and a positive workflow run ID")
          PY
      - name: Check out M3 branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-external-benchmark-decision-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scorer and reconciliation contract tests
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python -m pip install pytest
          PYTHONPATH=scripts python -m pytest -q tests/test_assemble_m3_real_evaluation_record.py tests/test_evaluate_external_benchmark_decisions.py tests/test_reconcile_official_fpl_manager_result.py tests/test_reconcile_official_fpl_manager_batch.py tests/test_audit_official_fpl_manager_batch.py tests/test_classify_historical_fpl_evidence.py
      - name: Capture and reconcile requested completed Gameweeks
        id: reconcile
        continue-on-error: true
        working-directory: canonical_candidate/engineering_workbench
        env:
          MANAGER_TEAM_ID: ${{ inputs.manager_team_id }}
          TARGET_GAMEWEEKS: ${{ inputs.gameweeks }}
        run: |
          python scripts/reconcile_official_fpl_manager_batch.py \
            --manager-team-id "$MANAGER_TEAM_ID" \
            --gameweeks "$TARGET_GAMEWEEKS" \
            --output official-fpl-manager-reconciliation-batch.json
      - name: Retrieve pre-deadline decision evidence artifact
        if: inputs.decision_evidence_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: predeadline-decision-evidence-manager-${{ inputs.manager_team_id }}-gw${{ inputs.gameweeks }}-run${{ inputs.decision_evidence_run_id }}
          run-id: ${{ inputs.decision_evidence_run_id }}
          github-token: ${{ github.token }}
          path: canonical_candidate/engineering_workbench/decision-evidence
      - name: Install retrieved decision evidence manifest
        if: inputs.decision_evidence_run_id != ''
        working-directory: canonical_candidate/engineering_workbench
        env:
          TARGET_GAMEWEEKS: ${{ inputs.gameweeks }}
        run: |
          if [[ "$TARGET_GAMEWEEKS" == *","* ]]; then
            echo "Decision evidence run IDs are currently one capture run per Gameweek; supply a single Gameweek."
            exit 1
          fi
          test -f decision-evidence/predeadline-decision-evidence.json
          cp decision-evidence/predeadline-decision-evidence.json official-fpl-decision-evidence-manifests.json
          if [ -f decision-evidence/predeadline-m3-recommendation.json ]; then
            cp decision-evidence/predeadline-m3-recommendation.json official-fpl-predeadline-m3-recommendation.json
          fi
          if [ -f decision-evidence/predeadline-m3-replay-report.json ]; then
            cp decision-evidence/predeadline-m3-replay-report.json official-fpl-predeadline-m3-replay-report.json
          fi
      - name: Audit batch hashes and reconciliation coverage
        id: audit
        if: always() && steps.reconcile.outcome != 'skipped'
        working-directory: canonical_candidate/engineering_workbench
        run: |
          MANIFEST_ARGS=()
          RECOMMENDATION_ARGS=()
          REPLAY_ARGS=()
          if [ -f official-fpl-decision-evidence-manifests.json ]; then
            MANIFEST_ARGS+=(--decision-manifests official-fpl-decision-evidence-manifests.json)
          fi
          if [ -f official-fpl-predeadline-m3-recommendation.json ]; then
            RECOMMENDATION_ARGS+=(--predeadline-recommendation official-fpl-predeadline-m3-recommendation.json)
          fi
          if [ -f official-fpl-predeadline-m3-replay-report.json ]; then
            REPLAY_ARGS+=(--predeadline-replay official-fpl-predeadline-m3-replay-report.json)
          fi
          python scripts/audit_official_fpl_manager_batch.py official-fpl-manager-reconciliation-batch.json "${MANIFEST_ARGS[@]}" "${RECOMMENDATION_ARGS[@]}" "${REPLAY_ARGS[@]}" --output official-fpl-manager-reconciliation-audit.json
      - name: Classify historical evidence admission
        id: admission
        if: always() && steps.audit.outcome == 'success'
        working-directory: canonical_candidate/engineering_workbench
        run: |
          MANIFEST_ARGS=()
          if [ -f official-fpl-decision-evidence-manifests.json ]; then
            MANIFEST_ARGS+=(--decision-manifests official-fpl-decision-evidence-manifests.json)
          fi
          python scripts/classify_historical_fpl_evidence.py official-fpl-manager-reconciliation-batch.json "${MANIFEST_ARGS[@]}" --audit-report official-fpl-manager-reconciliation-audit.json --output official-fpl-historical-evidence-admission.json
      - name: Check decision backtest admission
        id: decision_admission
        if: steps.admission.outcome == 'success' && steps.reconcile.outcome == 'success' && inputs.decision_evidence_run_id != ''
        working-directory: canonical_candidate/engineering_workbench
        env:
          TARGET_GAMEWEEK: ${{ inputs.gameweeks }}
        run: |
          python - <<'PY'
          import json, os
          gameweeks = [part.strip() for part in os.environ["TARGET_GAMEWEEK"].split(",") if part.strip()]
          if len(gameweeks) != 1:
              raise SystemExit("Decision evaluation requires exactly one target Gameweek")
          report = json.load(open("official-fpl-historical-evidence-admission.json", encoding="utf-8"))
          event = next((row for row in report.get("events", [])
                        if row.get("gameweek") == int(gameweeks[0])), None)
          eligible = bool(event and event.get("classification") == "DECISION_BACKTEST_ELIGIBLE"
                          and event.get("historical_evidence_admitted") is True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"eligible={'true' if eligible else 'false'}\n")
          print(json.dumps({"target_gameweek": int(gameweeks[0]), "decision_backtest_eligible": eligible}))
          PY
      - name: Assemble real M3 evaluation record
        id: assembly
        if: steps.decision_admission.outputs.eligible == 'true'
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/assemble_m3_real_evaluation_record.py \
            official-fpl-predeadline-m3-recommendation.json \
            --batch official-fpl-manager-reconciliation-batch.json \
            --audit-report official-fpl-manager-reconciliation-audit.json \
            --admission-report official-fpl-historical-evidence-admission.json \
            --output official-fpl-m3-evaluation-record.json
      - name: Score admitted real M3 decision event
        id: evaluation
        if: steps.assembly.outcome == 'success'
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/evaluate_external_benchmark_decisions.py \
            official-fpl-m3-evaluation-record.json \
            --admission-report official-fpl-historical-evidence-admission.json \
            --audit-report official-fpl-manager-reconciliation-audit.json \
            --batch official-fpl-manager-reconciliation-batch.json \
            --output official-fpl-m3-evaluation-result.json
      - name: Upload immutable batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-fpl-reconciliation-batch-${{ github.run_id }}
          path: |
            canonical_candidate/engineering_workbench/official-fpl-manager-reconciliation-batch.json
            canonical_candidate/engineering_workbench/official-fpl-manager-reconciliation-audit.json
            canonical_candidate/engineering_workbench/official-fpl-historical-evidence-admission.json
            canonical_candidate/engineering_workbench/official-fpl-decision-evidence-manifests.json
            canonical_candidate/engineering_workbench/official-fpl-predeadline-m3-recommendation.json
            canonical_candidate/engineering_workbench/official-fpl-predeadline-m3-replay-report.json
            canonical_candidate/engineering_workbench/official-fpl-m3-evaluation-record.json
            canonical_candidate/engineering_workbench/official-fpl-m3-evaluation-result.json
          if-no-files-found: warn
          retention-days: 90
      - name: Fail job if any requested Gameweek was excluded or audit failed
        if: steps.reconcile.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.assembly.outcome == 'failure' || steps.evaluation.outcome == 'failure'
        run: |
          echo "One or more requested Gameweeks could not be reconciled; inspect the uploaded batch artifact."
          exit 1

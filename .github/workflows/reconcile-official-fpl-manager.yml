name: Reconcile official FPL manager Gameweeks

on:
  workflow_dispatch:
    inputs:
      manager_team_id:
        description: FPL manager team ID
        required: true
        default: "421025"
        type: string
      gameweeks:
        description: Comma-separated completed Gameweeks to reconcile (e.g. 1,2,3,4,5,6,7,8,10)
        required: true
        default: "1,2,3,4,5,6,7,8,10"
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M3 implementation
        uses: actions/checkout@v4
        with:
          ref: feat/m3-external-benchmark-decision-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scorer and reconciliation contract tests
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python -m pip install pytest
          PYTHONPATH=scripts python -m pytest -q tests/test_evaluate_external_benchmark_decisions.py tests/test_reconcile_official_fpl_manager_result.py tests/test_reconcile_official_fpl_manager_batch.py tests/test_audit_official_fpl_manager_batch.py
      - name: Capture and reconcile requested completed Gameweeks
        id: reconcile
        continue-on-error: true
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/reconcile_official_fpl_manager_batch.py \
            --manager-team-id "${{ inputs.manager_team_id }}" \
            --gameweeks "${{ inputs.gameweeks }}" \
            --output official-fpl-manager-reconciliation-batch.json
      - name: Audit batch hashes and reconciliation coverage
        id: audit
        if: always() && steps.reconcile.outcome != 'skipped'
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/audit_official_fpl_manager_batch.py official-fpl-manager-reconciliation-batch.json --output official-fpl-manager-reconciliation-audit.json
      - name: Upload immutable batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-fpl-reconciliation-manager-${{ inputs.manager_team_id }}-batch
          path: |\n            canonical_candidate/engineering_workbench/official-fpl-manager-reconciliation-batch.json\n            canonical_candidate/engineering_workbench/official-fpl-manager-reconciliation-audit.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail job if any requested Gameweek was excluded
        if: steps.reconcile.outcome == 'failure'
        run: |
          echo "One or more requested Gameweeks could not be reconciled; inspect the uploaded batch artifact."
          exit 1

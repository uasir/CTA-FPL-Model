name: Reconcile official FPL manager Gameweek

on:
  workflow_dispatch:
    inputs:
      manager_team_id:
        description: FPL manager team ID
        required: true
        default: "421025"
        type: string
      gameweek:
        description: Completed Gameweek to reconcile
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M3 implementation
        uses: actions/checkout@v4
        with:
          ref: feat/m3-external-benchmark-decision-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scorer and reconciliation contract tests
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python -m pip install pytest
          PYTHONPATH=scripts python -m pytest -q tests/test_evaluate_external_benchmark_decisions.py tests/test_reconcile_official_fpl_manager_result.py
      - name: Capture and reconcile official manager result
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/capture_and_reconcile_official_fpl_manager_result.py \
            --manager-team-id "${{ inputs.manager_team_id }}" \
            --gameweek "${{ inputs.gameweek }}" \
            --output official-fpl-manager-reconciliation.json
      - name: Upload immutable reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: official-fpl-reconciliation-manager-${{ inputs.manager_team_id }}-gw${{ inputs.gameweek }}
          path: canonical_candidate/engineering_workbench/official-fpl-manager-reconciliation.json
          if-no-files-found: error
          retention-days: 90

            python canonical_candidate/engineering_workbench/scripts/compare_matched_abc_2pm_predictions.py \
              --abc-predictions "$RUNNER_TEMP/cta_2pm_same_cohort/abc_matched_predictions.csv" \
              --two-pm-predictions "$RUNNER_TEMP/cta_2pm_same_cohort/two_pm_matched_predictions.csv" \

      - canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_cta_incremental_value.py
      - canonical_candidate/engineering_workbench/scripts/evaluate_cta_abc_walk_forward.py
      - canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_temporal_xt.py
      - canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_xsuccess.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_xsuccess.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_temporal_xt.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_epl_2017_event_data_audit.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_cta_player_match_features.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_cta_event_adapter.py
      - canonical_candidate/engineering_workbench/tests/test_cta_engine_missingness.py
      - canonical_candidate/engineering_workbench/tests/test_run_wyscout_cta_core.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_fpl_identity_candidates.py
      - canonical_candidate/engineering_workbench/tests/test_11footy_historical_fpl_identity_candidates.py
      - canonical_candidate/engineering_workbench/tests/test_cross_provider_fpl_identity.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_verified_fpl_panel.py
      - canonical_candidate/engineering_workbench/tests/test_cta_abc_wyscout_panel.py
      - canonical_candidate/engineering_workbench/tests/test_evaluate_cta_abc_wyscout.py
      - canonical_candidate/engineering_workbench/tests/test_evaluate_cta_abc_walk_forward.py
      - canonical_candidate/engineering_workbench/tests/test_compare_matched_abc_2pm_predictions.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_cta_incremental_value.py
      - canonical_candidate/engineering_workbench/tests/test_evaluate_cta_abc_walk_forward.py
  push:
    branches: [main, "feat/**"]
    paths:
      - .github/workflows/cta-wyscout-epl-event-audit.yml
      - canonical_candidate/engineering_workbench/scripts/audit_wyscout_epl_2017_event_data.py
      - canonical_candidate/engineering_workbench/scripts/build_wyscout_cta_player_match_features.py
      - canonical_candidate/engineering_workbench/scripts/build_wyscout_cta_event_adapter.py
      - canonical_candidate/engineering_workbench/scripts/run_wyscout_cta_core.py
      - canonical_candidate/src/cta_engine.py
      - canonical_candidate/engineering_workbench/src/js/cta_core.mjs
      - canonical_candidate/engineering_workbench/config/cta_core_parity_contract.json
      - canonical_candidate/engineering_workbench/tests/test_core_parity.py
      - canonical_candidate/engineering_workbench/scripts/build_wyscout_fpl_identity_candidates.py
      - canonical_candidate/engineering_workbench/scripts/build_11footy_historical_fpl_identity_candidates.py
      - canonical_candidate/engineering_workbench/scripts/build_wyscout_verified_fpl_panel.py
      - canonical_candidate/engineering_workbench/scripts/build_cta_abc_wyscout_panel.py
      - canonical_candidate/engineering_workbench/scripts/build_vaastav_fpl_multiseason_panel.py
      - canonical_candidate/engineering_workbench/tests/test_vaastav_fpl_multiseason_panel.py
      - canonical_candidate/engineering_workbench/scripts/build_abc_expected_fixture_universe.py
      - canonical_candidate/engineering_workbench/scripts/aggregate_abc_player_gameweeks.py
      - canonical_candidate/engineering_workbench/tests/test_build_abc_expected_fixture_universe.py
      - canonical_candidate/engineering_workbench/tests/test_aggregate_abc_player_gameweeks.py
      - canonical_candidate/engineering_workbench/scripts/evaluate_cta_abc_walk_forward.py
      - canonical_candidate/engineering_workbench/scripts/build_matched_abc_2pm_fold_manifest.py
      - canonical_candidate/engineering_workbench/tests/test_build_matched_abc_2pm_fold_manifest.py
      - canonical_candidate/engineering_workbench/scripts/compare_abc_with_2pm_same_cohort.py
      - canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_cta_incremental_value.py
      - canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_temporal_xt.py
      - canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_xsuccess.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_xsuccess.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_temporal_xt.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_epl_2017_event_data_audit.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_cta_player_match_features.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_cta_event_adapter.py
      - canonical_candidate/engineering_workbench/tests/test_cta_engine_missingness.py
      - canonical_candidate/engineering_workbench/tests/test_run_wyscout_cta_core.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_fpl_identity_candidates.py
      - canonical_candidate/engineering_workbench/tests/test_11footy_historical_fpl_identity_candidates.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_verified_fpl_panel.py
      - canonical_candidate/engineering_workbench/tests/test_evaluate_cta_abc_walk_forward.py
      - canonical_candidate/engineering_workbench/tests/test_wyscout_cta_incremental_value.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cta-wyscout-epl-2017-event-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out CTA-FPL-Model
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Wyscout and 11footy identity resolver unit tests
        run: |
          python -m pip install pytest numpy
          PYTHONPATH=canonical_candidate/engineering_workbench/scripts:canonical_candidate/src python -m pytest -q \
            canonical_candidate/engineering_workbench/tests/test_cta_engine_missingness.py \
            canonical_candidate/engineering_workbench/tests/test_core_parity.py \
            canonical_candidate/engineering_workbench/tests/test_wyscout_cta_player_match_features.py \
            canonical_candidate/engineering_workbench/tests/test_wyscout_cta_event_adapter.py \
            canonical_candidate/engineering_workbench/tests/test_run_wyscout_cta_core.py \
            canonical_candidate/engineering_workbench/tests/test_wyscout_fpl_identity_candidates.py \
            canonical_candidate/engineering_workbench/tests/test_11footy_historical_fpl_identity_candidates.py \
            canonical_candidate/engineering_workbench/tests/test_cross_provider_fpl_identity.py \
            canonical_candidate/engineering_workbench/tests/test_wyscout_verified_fpl_panel.py \
            canonical_candidate/engineering_workbench/tests/test_wyscout_cta_incremental_value.py \
            canonical_candidate/engineering_workbench/tests/test_evaluate_cta_abc_walk_forward.py \
            canonical_candidate/engineering_workbench/tests/test_build_matched_abc_2pm_fold_manifest.py \
            canonical_candidate/engineering_workbench/tests/test_matched_fold_keys.py \
            canonical_candidate/engineering_workbench/tests/test_compare_matched_abc_2pm_predictions.py \
            canonical_candidate/engineering_workbench/tests/test_wyscout_temporal_xt.py \
            canonical_candidate/engineering_workbench/tests/test_wyscout_xsuccess.py

      - name: Download the public Wyscout 2017/18 data files
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/wyscout/source run_artifacts/wyscout/output
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 https://ndownloader.figshare.com/files/14464685 -o run_artifacts/wyscout/source/events.zip
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 https://ndownloader.figshare.com/files/14464622 -o run_artifacts/wyscout/source/matches.zip
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 https://ndownloader.figshare.com/files/15073721 -o run_artifacts/wyscout/source/players.json
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 https://ndownloader.figshare.com/files/15073697 -o run_artifacts/wyscout/source/teams.json

      - name: Audit EPL events, matches, player IDs and spatial coverage
        run: |
          python canonical_candidate/engineering_workbench/scripts/audit_wyscout_epl_2017_event_data.py --events-zip run_artifacts/wyscout/source/events.zip --matches-zip run_artifacts/wyscout/source/matches.zip --players-json run_artifacts/wyscout/source/players.json --teams-json run_artifacts/wyscout/source/teams.json --out-dir run_artifacts/wyscout/output

      - name: Build Wyscout CTA player-match features
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_wyscout_cta_player_match_features.py \
            --events-zip run_artifacts/wyscout/source/events.zip \
            --matches-zip run_artifacts/wyscout/source/matches.zip \
            --players-json run_artifacts/wyscout/source/players.json \
            --teams-json run_artifacts/wyscout/source/teams.json \
            --out-dir run_artifacts/wyscout/output

      - name: Normalize Wyscout events into CTA canonical event schema
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_wyscout_cta_event_adapter.py \
            --events-zip run_artifacts/wyscout/source/events.zip \
            --players run_artifacts/wyscout/source/players.json \
            --teams run_artifacts/wyscout/source/teams.json \
            --out run_artifacts/wyscout/output/cta_canonical_events.json \
            --report run_artifacts/wyscout/output/wyscout_cta_event_adapter_report.json

      - name: Execute normalized Wyscout events through canonical CTA core
        run: |
          python canonical_candidate/engineering_workbench/scripts/run_wyscout_cta_core.py \
            --events run_artifacts/wyscout/output/cta_canonical_events.json \
            --out-dir run_artifacts/wyscout/output/cta_core

      - name: Evaluate experimental time-horizon xT on chronological match holdout
        run: |
          python canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_temporal_xt.py \
            --events run_artifacts/wyscout/output/cta_canonical_events.json \
            --matches-zip run_artifacts/wyscout/source/matches.zip \
            --out run_artifacts/wyscout/output/wyscout_temporal_xt_report.json

      - name: Evaluate contextual pass-completion probability (xSuccess)
        run: |
          python canonical_candidate/engineering_workbench/scripts/evaluate_wyscout_xsuccess.py \
            --events-zip run_artifacts/wyscout/source/events.zip \
            --matches-zip run_artifacts/wyscout/source/matches.zip \
            --out run_artifacts/wyscout/output/wyscout_xsuccess_report.json

      - name: Download pinned historical FPL 2017/18 identity and match-history files
        run: |
          set -euo pipefail
          FPL_SOURCE_COMMIT="d7b05b51d137bfefef4b692386d18c610975b9b9"
          FPL_RAW_BASE="https://raw.githubusercontent.com/vaastav/Fantasy-Premier-League/${FPL_SOURCE_COMMIT}/data"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "${FPL_RAW_BASE}/2017-18/players_raw.csv" -o run_artifacts/wyscout/source/fpl_players_raw.csv
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "${FPL_RAW_BASE}/2017-18/player_idlist.csv" -o run_artifacts/wyscout/source/fpl_player_idlist.csv
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            "${FPL_RAW_BASE}/2017-18/gws/merged_gw.csv" -o run_artifacts/wyscout/source/fpl_merged_gw.csv
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "${FPL_RAW_BASE}/master_team_list.csv" -o run_artifacts/wyscout/source/fpl_master_team_list.csv

      - name: Build pending-only Wyscout to historical FPL identity review queue
        run: |
          python canonical_candidate/engineering_workbench/scripts/build_wyscout_fpl_identity_candidates.py \
            --wyscout-player-match run_artifacts/wyscout/output/wyscout_cta_player_match.csv \
            --wyscout-players run_artifacts/wyscout/source/players.json \
            --fpl-players run_artifacts/wyscout/source/fpl_players_raw.csv \
            --fpl-player-idlist run_artifacts/wyscout/source/fpl_player_idlist.csv \
            --fpl-gameweek-history run_artifacts/wyscout/source/fpl_merged_gw.csv \
            --fpl-team-list run_artifacts/wyscout/source/fpl_master_team_list.csv \
            --fpl-source-commit "d7b05b51d137bfefef4b692386d18c610975b9b9" \
            --out-dir run_artifacts/wyscout/output

      - name: Download pinned 11footy databases for historical identity corroboration
        id: download_11footy
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p run_artifacts/wyscout/source
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            https://github.com/fm-devlab/11footy-dataset/releases/download/11footy-2026-11-10/england.premier-league.db.xz \
            -o run_artifacts/wyscout/source/11footy-england.premier-league.db.xz
          echo "a74e735c01a0f6da9b871ade0031573e212ba7f8be0698b29d240921aea0485f  run_artifacts/wyscout/source/11footy-england.premier-league.db.xz" | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://github.com/fm-devlab/11footy-dataset/releases/download/11footy-2026-11-10/players.db.xz \
            -o run_artifacts/wyscout/source/11footy-players.db.xz
          echo "a0ad11b9f7bb8f845c6f62bc2cacc27639ea7a7f2f9ce861485297bc6db0d0c2  run_artifacts/wyscout/source/11footy-players.db.xz" | sha256sum --check

      - name: Fetch current official FPL bootstrap for cross-season identity corroboration
        id: fetch_current_fpl
        continue-on-error: true
        if: steps.download_11footy.outcome == 'success'
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            -H "User-Agent: CTA-FPL-Model/1.0" \
            https://fantasy.premierleague.com/api/bootstrap-static/ \
            -o run_artifacts/wyscout/source/current_fpl_bootstrap.json

      - name: Generate current-season 11footy to FPL candidate crosswalk
        id: current_11footy_candidates
        continue-on-error: true
        if: steps.download_11footy.outcome == 'success' && steps.fetch_current_fpl.outcome == 'success'
        run: |
          python canonical_candidate/engineering_workbench/scripts/audit_11footy_fpl_identity_candidates.py \
            --players-input run_artifacts/wyscout/source/11footy-players.db.xz \
            --fpl-bootstrap run_artifacts/wyscout/source/current_fpl_bootstrap.json \
            --season "2026/27" \
            --release "11footy-2026-11-10" \
            --out-dir run_artifacts/wyscout/output/current_11footy

      - name: Build pending-only 11footy to historical FPL identity review queue
        if: steps.download_11footy.outcome == 'success'
        continue-on-error: true
        run: |
          CURRENT_CANDIDATE_ARGS=()
          if [ -f run_artifacts/wyscout/output/current_11footy/identity_candidates.csv ]; then
            CURRENT_CANDIDATE_ARGS+=(--current-candidates run_artifacts/wyscout/output/current_11footy/identity_candidates.csv)
          fi
          python canonical_candidate/engineering_workbench/scripts/build_11footy_historical_fpl_identity_candidates.py \
            --database run_artifacts/wyscout/source/11footy-england.premier-league.db.xz \
            --players-database run_artifacts/wyscout/source/11footy-players.db.xz \
            --fpl-players run_artifacts/wyscout/source/fpl_players_raw.csv \
            --fpl-player-idlist run_artifacts/wyscout/source/fpl_player_idlist.csv \
            --fpl-gameweek-history run_artifacts/wyscout/source/fpl_merged_gw.csv \
            --fpl-team-list run_artifacts/wyscout/source/fpl_master_team_list.csv \
            --fpl-source-commit "d7b05b51d137bfefef4b692386d18c610975b9b9" \
            --11footy-release "11footy-2026-11-10" \
            --out-dir run_artifacts/wyscout/output \
            "${CURRENT_CANDIDATE_ARGS[@]}"

      - name: Verify historical FPL IDs through independent Wyscout and 11footy evidence
        if: steps.download_11footy.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -f run_artifacts/wyscout/output/wyscout_fpl_identity_candidates.csv ] && [ -f run_artifacts/wyscout/output/11footy_fpl_identity_candidates.csv ]; then
            python canonical_candidate/engineering_workbench/scripts/verify_cross_provider_fpl_identity.py \
              --wyscout-candidates run_artifacts/wyscout/output/wyscout_fpl_identity_candidates.csv \
              --11footy-candidates run_artifacts/wyscout/output/11footy_fpl_identity_candidates.csv \
              --out-dir run_artifacts/wyscout/output/cross_provider_identity
          else
            echo "WARNING: one or both historical provider candidate queues are unavailable"
          fi

      - name: Prepare the existing verified 11footy crosswalk and historical fixture inputs
        if: steps.download_11footy.outcome == 'success'
        continue-on-error: true
        run: |
          CROSSWALK="run_artifacts/wyscout/output/cross_provider_identity/verified_wyscout_fpl_identity_crosswalk.csv"
          CANDIDATES="run_artifacts/wyscout/output/11footy_fpl_identity_candidates.csv"
          if [ -f "$CROSSWALK" ] && [ -f "$CANDIDATES" ]; then
            python canonical_candidate/engineering_workbench/scripts/prepare_abc_11footy_verified_inputs.py \
              --candidates "$CANDIDATES" \
              --crosswalk "$CROSSWALK" \
              --fpl-history run_artifacts/wyscout/source/fpl_merged_gw.csv \
              --team-list run_artifacts/wyscout/source/fpl_master_team_list.csv \
              --out-dir run_artifacts/wyscout/output/abc_11footy_inputs
          else
            echo "WARNING: historical 11footy candidates or strict cross-provider crosswalk unavailable"
          fi

      - name: Build strict verified historical 11footy player-match feature panel
        if: steps.download_11footy.outcome == 'success'
        continue-on-error: true
        run: |
          INPUT="run_artifacts/wyscout/output/abc_11footy_inputs"
          if [ -f "$INPUT/11footy_crosswalk_validation.json" ]; then
            python canonical_candidate/engineering_workbench/scripts/build_11footy_player_match_features.py \
              --database run_artifacts/wyscout/source/11footy-england.premier-league.db.xz \
              --players-database run_artifacts/wyscout/source/11footy-players.db.xz \
              --fpl-fixtures "$INPUT/historical_fpl_fixtures.csv" \
              --fpl-players run_artifacts/wyscout/source/fpl_players_raw.csv \
              --fpl-player-fixture run_artifacts/wyscout/source/fpl_merged_gw.csv \
              --candidates "$INPUT/11footy_builder_candidates.csv" \
              --crosswalk "$INPUT/11footy_builder_verified_crosswalk.csv" \
              --crosswalk-validation "$INPUT/11footy_crosswalk_validation.json" \
              --season "2017/18" \
              --release "11footy-2026-11-10" \
              --out-dir run_artifacts/wyscout/output/abc_11footy
          else
            echo "WARNING: prepared verified 11footy input contract unavailable"
          fi

      - name: Build verified Wyscout-to-FPL player-match and strictly lagged research panel
        if: steps.download_11footy.outcome == 'success'
        continue-on-error: true
        run: |
          CROSSWALK="run_artifacts/wyscout/output/cross_provider_identity/verified_wyscout_fpl_identity_crosswalk.csv"
          if [ -f "$CROSSWALK" ]; then
            python canonical_candidate/engineering_workbench/scripts/build_wyscout_verified_fpl_panel.py \
              --wyscout-player-match run_artifacts/wyscout/output/wyscout_cta_player_match.csv \
              --cross-provider-crosswalk "$CROSSWALK" \
              --fpl-gameweek-history run_artifacts/wyscout/source/fpl_merged_gw.csv \
              --fpl-team-list run_artifacts/wyscout/source/fpl_master_team_list.csv \
              --out-dir run_artifacts/wyscout/output/verified_fpl_panel
          else
            echo "WARNING: no cross-provider verified identity file; Wyscout player-level panel not built"
          fi

      - name: Build integrated historical Wyscout A/B/C player-fixture panel
        if: always()
        continue-on-error: true
        run: |
          LAGGED="run_artifacts/wyscout/output/verified_fpl_panel/wyscout_lagged_fpl_research_features.csv"
          REPORT="run_artifacts/wyscout/output/verified_fpl_panel/wyscout_verified_fpl_panel_report.json"
          if [ -f "$LAGGED" ] && [ -f "$REPORT" ]; then
            python canonical_candidate/engineering_workbench/scripts/build_cta_abc_wyscout_panel.py \
              --lagged-features "$LAGGED" \
              --source-report "$REPORT" \
              --out-dir run_artifacts/wyscout/output/verified_fpl_panel/cta_abc
          else
            echo "WARNING: verified historical Wyscout/FPL lagged panel unavailable"

          REPORT="run_artifacts/wyscout/output/verified_fpl_panel/wyscout_verified_fpl_panel_report.json"
          if [ -f "$PANEL" ] && [ -f "$REPORT" ]; then
            python canonical_candidate/engineering_workbench/scripts/evaluate_cta_abc_walk_forward.py \
              --abc-panel "$PANEL" \
              --source-report "$REPORT" \
              --out run_artifacts/wyscout/output/verified_fpl_panel/cta_abc/cta_abc_walk_forward_report.json
          else
            echo "WARNING: integrated historical A/B/C panel unavailable for walk-forward evaluation"
          fi

      - name: Install CPU PyTorch for independent 2PM comparator
        if: always()
        continue-on-error: true
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Build pinned 2016/17-2017/18 conventional FPL panel for matched 2PM evaluation
        if: always()
        continue-on-error: true
        working-directory: canonical_candidate/engineering_workbench
        run: |
          python scripts/build_vaastav_fpl_multiseason_panel.py \
            --out-dir "$RUNNER_TEMP/cta_2pm_same_cohort" \
            --seasons 2016-17 2017-18

      - name: Validate exact player-GW fixture universe and aggregate ABC features
        if: always()
        continue-on-error: true
        working-directory: canonical_candidate/engineering_workbench
        run: |
          ABC_PANEL="../../run_artifacts/wyscout/output/verified_fpl_panel/cta_abc/cta_abc_wyscout_player_fixture_panel.csv"

              --fpl-panel-report "$FPL_REPORT" \
              --expected-fixtures-out "$OUT_DIR/expected_fixture_ids.csv" \
              --report-out "$REPORT_DIR/abc_expected_fixture_reference_report.json"
            python scripts/aggregate_abc_player_gameweeks.py \
              --input "$ABC_PANEL" \
              --expected-fixtures "$OUT_DIR/expected_fixture_ids.csv" \
              --out "$OUT_DIR/abc_player_gameweek_panel.csv" \

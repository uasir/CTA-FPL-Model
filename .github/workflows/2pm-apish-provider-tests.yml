name: 2PM API.SH provider unit tests

on:
  push:
    branches:
      - feat/2pm-defensive-2025-26-train-2026-27-oot
    paths:
      - canonical_candidate/engineering_workbench/scripts/understat_apish_provider.py
      - canonical_candidate/engineering_workbench/tests/test_understat_apish_provider.py
      - .github/workflows/2pm-apish-provider-tests.yml
  pull_request:
    paths:
      - canonical_candidate/engineering_workbench/scripts/understat_apish_provider.py
      - canonical_candidate/engineering_workbench/tests/test_understat_apish_provider.py
      - .github/workflows/2pm-apish-provider-tests.yml

permissions:
  contents: read

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run API.SH provider tests
        env:
          PYTHONPATH: canonical_candidate/engineering_workbench/scripts
        run: |
          python -m unittest discover -s canonical_candidate/engineering_workbench/tests -p 'test_understat_apish_provider.py' -v
          python -m py_compile canonical_candidate/engineering_workbench/scripts/understat_apish_provider.py
